    <div class="modal-body">
      <div class="form-group"><label class="form-label">用户名 *</label><input class="form-input" type="text" id="regUsername" placeholder="登录用户名" autocomplete="off"></div>
      <div class="form-group"><label class="form-label">密码 *</label><input class="form-input" type="password" id="regPassword" placeholder="至少 6 位" autocomplete="new-password"></div>
      <div class="form-group"><label class="form-label">确认密码 *</label><input class="form-input" type="password" id="regPassword2" placeholder="再次输入密码" autocomplete="new-password"></div>

    </div>

      <button class="btn btn-success" id="registerSubmit">注 册</button>
    </div>
  </div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
(function() {
  var form = document.getElementById('loginForm');
  var loginBtn = document.getElementById('loginBtn');
  var username = document.getElementById('username');
  var password = document.getElementById('password');
  var toast = document.getElementById('toast');

  function showToast(msg, type) {
    toast.textContent = msg;
    toast.className = 'toast ' + type + ' show';
    clearTimeout(toast._timer);
    toast._timer = setTimeout(function() {
      toast.classList.remove('show');
    }, 3000);
  }

  function showError(field, msg) {
    var el = document.getElementById(field + 'Error');
    el.textContent = msg;
    el.classList.add('show');
    document.getElementById(field).classList.add('error');
  }

  function clearErrors() {
    ['username', 'password'].forEach(function(id) {
      document.getElementById(id + 'Error').classList.remove('show');
      document.getElementById(id).classList.remove('error');
    });
  }

  // Simulate API login
  function simulateLogin(user, pass) {
    return new Promise(function(resolve) {
      setTimeout(function() {
        if (!user) {
          resolve({ success: false, error: '请输入用户名' });
        } else if (!pass) {
          resolve({ success: false, error: '请输入密码' });
        } else if (user === 'admin' && pass === 'admin123') {
          resolve({
            success: true,
            data: {
              access_token: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...',
              refresh_token: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...',
              token_type: 'bearer',
              user: {
                id: 'a1b2c3d4e5f6',
                username: 'admin',
                display_name: '系统管理员',
                email: 'admin@kb.com',
                department_name: '技术部',
                is_superuser: true,
                roles: ['super_admin']
              }
            }
          });
        } else if (user === 'zhangsan' && pass === '123456') {
          resolve({
            success: true,
            data: {
              access_token: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...',
              refresh_token: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...',
              token_type: 'bearer',
              user: {
                id: 'b2c3d4e5f6a7',
                username: 'zhangsan',
                display_name: '张三',
                email: 'zhangsan@kb.com',
                department_name: '产品部',
                is_superuser: false,
                roles: ['knowledge_admin']
              }
            }
          });
        } else if (user === 'lisi' && pass === '123456') {
          resolve({
            success: true,
            data: {
              access_token: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...',
              refresh_token: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...',
              token_type: 'bearer',
              user: {
                id: 'c3d4e5f6a7b8',
                username: 'lisi',
                display_name: '李四',
                email: 'lisi@kb.com',
                department_name: '运营部',
                is_superuser: false,
                roles: ['user']
              }
            }
          });
        } else {
          resolve({ success: false, error: '用户名或密码错误' });
        }
      }, 800 + Math.random() * 400);
    });
  }

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    clearErrors();

    var user = username.value.trim();
    var pass = password.value;

    // Validate
    var hasError = false;
    if (!user) { showError('username', '请输入用户名'); hasError = true; }
    if (!pass) { showError('password', '请输入密码'); hasError = true; }
    if (hasError) return;

    // Loading state
    loginBtn.classList.add('loading');
    loginBtn.disabled = true;

    simulateLogin(user, pass).then(function(res) {
      loginBtn.classList.remove('loading');
      loginBtn.disabled = false;

      if (res.success) {
        // Store token (simulated)
        if (document.getElementById('remember').checked) {
          try {
            localStorage.setItem('kb_token', JSON.stringify(res.data));
          } catch(e) {}
        }
        sessionStorage.setItem('kb_token', JSON.stringify(res.data));

        showToast('登录成功，正在跳转…', 'success');

        // Redirect to main page
        setTimeout(function() {
          window.location.href = 'qa-demo.html';
        }, 800);
      } else {
        showToast(res.error, 'error');
      }
    });
  });

  // Quick login hint (dev convenience)
  username.addEventListener('dblclick', function() {
    username.value = 'admin';
    password.value = 'admin123';
  });

  // ===== Register =====
  var registerModal = document.getElementById('registerModal');
  document.getElementById('showRegister').addEventListener('click', function() {
    // Clear form
    ['regUsername','regPassword','regPassword2','regDisplayName','regEmail'].forEach(function(id) { document.getElementById(id).value = ''; });
    registerModal.classList.add('show');
  });
  document.getElementById('registerClose').addEventListener('click', function() { registerModal.classList.remove('show'); });
  document.getElementById('registerCancel').addEventListener('click', function() { registerModal.classList.remove('show'); });
  registerModal.addEventListener('click', function(e) { if (e.target === this) this.classList.remove('show'); });

  document.getElementById('registerSubmit').addEventListener('click', function() {
    var uname = document.getElementById('regUsername').value.trim();
    var pwd = document.getElementById('regPassword').value;
    var pwd2 = document.getElementById('regPassword2').value;
    var dname = document.getElementById('regDisplayName').value.trim();
    var email = document.getElementById('regEmail').value.trim();

    if (!uname) { showToast('请输入用户名', 'error'); return; }
    if (uname.length < 3) { showToast('用户名至少 3 个字符', 'error'); return; }
    if (!pwd) { showToast('请输入密码', 'error'); return; }
    if (pwd.length < 6) { showToast('密码至少 6 位', 'error'); return; }
    if (pwd !== pwd2) { showToast('两次密码不一致', 'error'); return; }

    // Simulate API call: POST /api/users
    registerModal.classList.remove('show');
    showToast('注册成功，请登录', 'success');

    // Auto-fill login form
    username.value = uname;
    password.value = '';
    username.focus();
  });
})();
</script>
