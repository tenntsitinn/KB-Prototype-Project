        </div>
        <div class="table-card">

<div class="toast" id="toast"></div>

<script>
(function() {
  var tokenData = sessionStorage.getItem('kb_token') || localStorage.getItem('kb_token');
  if (!tokenData) { window.location.replace('login.html'); return; }

  // Role-based sidebar visibility
  var userData = getUserData(tokenData);
  if (userData) {
    var roles = userData.roles || [];
    if (roles.indexOf('super_admin') === -1) {
      var navSettlement = document.getElementById('navSettlement');
      var navAdmin = document.getElementById('navAdmin');
      var navDivider1 = document.getElementById('navDivider1');
      var navDivider2 = document.getElementById('navDivider2');
      if (roles.indexOf('knowledge_admin') !== -1) {
        if (navAdmin) navAdmin.style.display = 'none';
      } else {
        if (navDivider1) navDivider1.style.display = 'none';
        if (navSettlement) navSettlement.style.display = 'none';
        if (navDivider2) navDivider2.style.display = 'none';
        if (navAdmin) navAdmin.style.display = 'none';
      }
    }
    var avatar = document.querySelector('.user-avatar');
    var nameEl = document.querySelector('.user-name');
    var roleEl = document.querySelector('.user-role');
    if (nameEl) nameEl.textContent = userData.display_name || userData.username || '';
    if (avatar && nameEl) avatar.textContent = (nameEl.textContent || 'U').charAt(0);
    if (roleEl) {
      if (roles.indexOf('super_admin') !== -1) roleEl.textContent = '系统管理员';
      else if (roles.indexOf('knowledge_admin') !== -1) roleEl.textContent = '知识管理员';
      else roleEl.textContent = '普通用户';
    }
    document.getElementById('popupAvatar').textContent = (userData.display_name || userData.username || 'U').charAt(0);
    document.getElementById('popupName').textContent = userData.display_name || userData.username || '';
    document.getElementById('popupRole').textContent = roleEl ? roleEl.textContent : '';
    document.getElementById('popupUsername').textContent = userData.username || '';
    document.getElementById('popupEmail').textContent = userData.email || '未设置';
    document.getElementById('popupDept').textContent = userData.department_name || '未设置';
  }

  // User popup
  var userCard = document.querySelector('.user-card');
  var userPopup = document.getElementById('userPopup');
  var userPopupOverlay = document.getElementById('userPopupOverlay');

  function showPopup() {
    var rect = userCard.getBoundingClientRect();
    userPopup.style.left = Math.min(rect.left, window.innerWidth - 296) + 'px';
    userPopup.style.bottom = (window.innerHeight - rect.top + 8) + 'px';
    userPopup.classList.add('show');
    userPopupOverlay.classList.add('show');
  }

  function hidePopup() {
    userPopup.classList.remove('show');
    userPopupOverlay.classList.remove('show');
  }

  userCard.addEventListener('click', function(e) {
    e.stopPropagation();
    if (userPopup.classList.contains('show')) { hidePopup(); } else { showPopup(); }
  });

  userPopupOverlay.addEventListener('click', hidePopup);

  document.getElementById('popupSettings').addEventListener('click', function() {
    hidePopup();
    window.location.href = 'settings.html';
  });

  function getUserData(raw) {
    try { var d = JSON.parse(raw); return d.user || d; } catch(e) { return null; }
  }

  document.getElementById('popupLogout').addEventListener('click', function() {
    hidePopup();
    sessionStorage.removeItem('kb_token'); localStorage.removeItem('kb_token');
    window.location.replace('login.html');
  });

  // ===== Data =====
  var users = [
    { id:'u1', username:'admin', display_name:'系统管理员', email:'admin@kb.com', department_id:'d1', department_name:'技术部', status:'active', is_superuser:true, roles:['系统管理员'], last_login_at:'2026-08-17 09:30', created_at:'2026-08-01' },
    { id:'u2', username:'zhangsan', display_name:'张三', email:'zhangsan@kb.com', department_id:'d2', department_name:'产品部', status:'active', is_superuser:false, roles:['知识管理员'], last_login_at:'2026-08-16 15:00', created_at:'2026-08-03' },
    { id:'u3', username:'lisi', display_name:'李四', email:'lisi@kb.com', department_id:'d1', department_name:'技术部', status:'active', is_superuser:false, roles:['普通用户'], last_login_at:'2026-08-17 08:00', created_at:'2026-08-05' },
    { id:'u4', username:'wangwu', display_name:'王五', email:'wangwu@kb.com', department_id:'d3', department_name:'运营部', status:'inactive', is_superuser:false, roles:[], last_login_at:'2026-08-10', created_at:'2026-08-06' },
  ];
  var roles = [
    { id:'r1', role_name:'系统管理员', role_code:'super_admin', description:'全局最高权限，可管理所有系统功能', permissions:['user:manage','role:manage','dept:manage','knowledge:manage','knowledge:view','faq:manage','dashboard:view'] },
    { id:'r2', role_name:'知识管理员', role_code:'knowledge_admin', description:'管理知识库内容、FAQ 和权限配置', permissions:['knowledge:manage','knowledge:view','faq:manage','dashboard:view'] },
    { id:'r3', role_name:'普通用户', role_code:'user', description:'知识库的基础使用权限', permissions:['knowledge:view'] },
  ];
  var depts = [
    { id:'d1', parent_id:'', parent_name:'', name:'技术部', leader_id:'u1', leader_name:'系统管理员', sort_order:1 },
    { id:'d2', parent_id:'', parent_name:'', name:'产品部', leader_id:'u2', leader_name:'张三', sort_order:2 },
    { id:'d3', parent_id:'', parent_name:'', name:'运营部', leader_id:'', leader_name:'', sort_order:3 },
    { id:'d4', parent_id:'d1', parent_name:'技术部', name:'基础架构组', leader_id:'u3', leader_name:'李四', sort_order:1 },
  ];
  var allPermissions = [
    { code:'user:manage', label:'用户管理' },
    { code:'role:manage', label:'角色管理' },
    { code:'dept:manage', label:'部门管理' },
    { code:'knowledge:manage', label:'知识管理（写入）' },
    { code:'knowledge:view', label:'知识查看' },
    { code:'faq:manage', label:'FAQ 管理' },
    { code:'dashboard:view', label:'数据看板' },
  ];

  var currentTab = 'users';
  var userPage = 1, userPageSize = 10;
  var editingUserId = null, editingRoleId = null, editingDeptId = null;

  // ===== Tab switching =====
  document.querySelectorAll('.tab-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
      this.classList.add('active');
      currentTab = this.dataset.tab;
      document.getElementById('panelUsers').style.display = (currentTab === 'users') ? '' : 'none';
      document.getElementById('panelRoles').style.display = (currentTab === 'roles') ? '' : 'none';
      document.getElementById('panelDepts').style.display = (currentTab === 'depts') ? '' : 'none';
      if (currentTab === 'users') renderUsers();
      else if (currentTab === 'roles') renderRoles();
      else renderDepts();
    });
  });

  // ===== Users =====
  function renderUsers() {
    var q = (document.getElementById('userSearch').value || '').toLowerCase();
    var filtered = q ? users.filter(function(u) { return u.username.toLowerCase().indexOf(q) !== -1 || u.display_name.toLowerCase().indexOf(q) !== -1; }) : users;
    var total = filtered.length;
    var totalPages = Math.ceil(total / userPageSize);
    if (userPage > totalPages) userPage = Math.max(1, totalPages);
    var start = (userPage - 1) * userPageSize;
    var items = filtered.slice(start, start + userPageSize);
    var tbody = document.getElementById('userBody');
    if (items.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><p>暂无匹配用户</p></div></td></tr>';
    } else {
      tbody.innerHTML = items.map(function(u) {
        return '<tr><td><span class="cell-text" style="font-weight:500">' + esc(u.username) + (u.is_superuser ? ' <span style="color:var(--warning);font-size:11px">(超管)</span>' : '') + '</span></td>' +
          '<td>' + esc(u.display_name || '-') + '</td>' +
          '<td><span class="cell-text">' + esc(u.email || '-') + '</span></td>' +
          '<td>' + esc(u.department_name || '-') + '</td>' +
          '<td>' + (u.roles || []).map(function(r) { return '<span class="role-tag">' + esc(r) + '</span>'; }).join('') + '</td>' +
          '<td><span class="status-badge ' + u.status + '"><span class="status-dot"></span>' + (u.status === 'active' ? '启用' : '禁用') + '</span></td>' +
          '<td><div class="actions-cell"><button class="btn btn-outline btn-xs user-edit-btn" data-id="' + u.id + '">编辑</button><button class="btn btn-outline btn-xs user-role-btn" data-id="' + u.id + '">分配角色</button></div></td></tr>';
      }).join('');
    }
    document.getElementById('userTotal').textContent = '共 ' + total + ' 条';
    renderPagination('userPagination', totalPages, userPage, function(p) { userPage = p; renderUsers(); });
  }

  document.getElementById('userSearch').addEventListener('input', function() { userPage = 1; renderUsers(); });

  document.getElementById('userBody').addEventListener('click', function(e) {
    var id = e.target.dataset.id;
    if (!id) return;
    var u = users.find(function(x) { return x.id === id; });
    if (!u) return;
    if (e.target.classList.contains('user-edit-btn')) openUserModal(u);
    else if (e.target.classList.contains('user-role-btn')) openUserRoleModal(u);
  });

  document.getElementById('addUserBtn').addEventListener('click', function() { openUserModal(null); });

  function openUserModal(user) {
    editingUserId = user ? user.id : null;
    document.getElementById('userModalTitle').textContent = user ? '编辑用户' : '新建用户';
    document.getElementById('userFUsername').value = user ? user.username : '';
    document.getElementById('userFUsername').disabled = !!user;
    document.getElementById('userFPwdGroup').style.display = user ? 'none' : '';
    document.getElementById('userFPassword').value = '';
    document.getElementById('userFDisplayName').value = user ? (user.display_name || '') : '';
    document.getElementById('userFEmail').value = user ? (user.email || '') : '';
    document.getElementById('userFStatus').value = user ? user.status : 'active';
    // Departments
    var sel = document.getElementById('userFDept');
    sel.innerHTML = '<option value="">-- 无 --</option>' + depts.map(function(d) { return '<option value="' + d.id + '">' + esc(d.name) + '</option>'; }).join('');
    sel.value = user ? (user.department_id || '') : '';
    // Roles
    var box = document.getElementById('userFRoles');
    var userRoles = user ? (user.roles || []) : [];
    box.innerHTML = roles.map(function(r) {
      return '<label class="checkbox-item' + (userRoles.indexOf(r.role_name) !== -1 ? ' checked' : '') + '"><input type="checkbox" value="' + r.role_code + '">' + esc(r.role_name) + '</label>';
    }).join('');
    document.getElementById('userModal').classList.add('show');
  }

  document.getElementById('userModalSave').addEventListener('click', function() {
    var username = document.getElementById('userFUsername').value.trim();
    var password = document.getElementById('userFPassword').value;
    if (!username) { showToast('请输入用户名', 'error'); return; }
    if (!editingUserId && !password) { showToast('请输入密码', 'error'); return; }
    var deptId = document.getElementById('userFDept').value;
    var deptName = depts.find(function(d) { return d.id === deptId; });
    var selectedRoles = [];
    document.querySelectorAll('#userFRoles .checkbox-item.checked input').forEach(function(cb) { selectedRoles.push(cb.value); });
    var roleNames = selectedRoles.map(function(rc) { var r = roles.find(function(r) { return r.role_code === rc; }); return r ? r.role_name : rc; });
    if (editingUserId) {
      var u = users.find(function(x) { return x.id === editingUserId; });
      if (u) {
        u.display_name = document.getElementById('userFDisplayName').value.trim();
        u.email = document.getElementById('userFEmail').value.trim();
        u.department_id = deptId;
        u.department_name = deptName ? deptName.name : '';
        u.status = document.getElementById('userFStatus').value;
        u.roles = roleNames;
      }
    } else {
      users.push({ id:'u' + (users.length + 1), username:username, display_name:document.getElementById('userFDisplayName').value.trim(), email:document.getElementById('userFEmail').value.trim(), department_id:deptId, department_name:deptName ? deptName.name : '', status:'active', is_superuser:false, roles:roleNames, last_login_at:'', created_at:'2026-08-17' });
    }
    document.getElementById('userModal').classList.remove('show');
    renderUsers();
    showToast(editingUserId ? '用户已更新' : '用户已创建', 'success');
  });

  function openUserRoleModal(user) {
    editingUserId = user.id;
    var box = document.getElementById('userFRoles');
    box.innerHTML = roles.map(function(r) {
      return '<label class="checkbox-item' + ((user.roles || []).indexOf(r.role_name) !== -1 ? ' checked' : '') + '"><input type="checkbox" value="' + r.role_code + '">' + esc(r.role_name) + '</label>';
    }).join('');
    document.getElementById('userFUsername').value = user.username;
    document.getElementById('userFUsername').disabled = true;
    document.getElementById('userFPwdGroup').style.display = 'none';
    document.getElementById('userFDisplayName').value = '';
    document.getElementById('userFEmail').value = '';
    document.getElementById('userFDept').innerHTML = '<option value="">-- 无 --</option>';
    document.getElementById('userFStatus').value = 'active';
    document.getElementById('userModalTitle').textContent = '分配角色 - ' + user.username;
    document.getElementById('userModal').classList.add('show');
  }

  document.getElementById('userModalClose').addEventListener('click', function() { document.getElementById('userModal').classList.remove('show'); });
  document.getElementById('userModalCancel').addEventListener('click', function() { document.getElementById('userModal').classList.remove('show'); });
  document.getElementById('userModal').addEventListener('click', function(e) { if (e.target === this) this.classList.remove('show'); });

  document.getElementById('userFRoles').addEventListener('click', function(e) {
    var item = e.target.closest('.checkbox-item');
    if (item) {
      item.classList.toggle('checked');
      item.querySelector('input').checked = item.classList.contains('checked');
    }
  });

  // ===== Roles =====
  function renderRoles() {
    var q = (document.getElementById('roleSearch').value || '').toLowerCase();
    var filtered = q ? roles.filter(function(r) { return r.role_name.toLowerCase().indexOf(q) !== -1 || r.role_code.toLowerCase().indexOf(q) !== -1; }) : roles;
    var tbody = document.getElementById('roleBody');
    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5"><div class="empty-state"><p>暂无匹配角色</p></div></td></tr>';
    } else {
      tbody.innerHTML = filtered.map(function(r) {
        var permLabels = allPermissions.filter(function(p) { return (r.permissions || []).indexOf(p.code) !== -1; }).map(function(p) { return p.label; });
        return '<tr><td style="font-weight:500">' + esc(r.role_name) + '</td>' +
          '<td><code style="font-size:12px;background:var(--bg-input);padding:2px 6px;border-radius:4px">' + esc(r.role_code) + '</code></td>' +
          '<td><span class="cell-text">' + esc(r.description || '-') + '</span></td>' +
          '<td>' + permLabels.map(function(l) { return '<span class="perm-tag">' + esc(l) + '</span>'; }).join('') + '</td>' +
          '<td><div class="actions-cell"><button class="btn btn-outline btn-xs role-edit-btn" data-id="' + r.id + '">编辑</button><button class="btn btn-outline btn-xs role-perm-btn" data-id="' + r.id + '">权限</button><button class="btn btn-danger btn-xs role-delete-btn" data-id="' + r.id + '">删除</button></div></td></tr>';
      }).join('');
    }
    document.getElementById('roleTotal').textContent = '共 ' + roles.length + ' 条';
  }

  document.getElementById('roleSearch').addEventListener('input', renderRoles);

  document.getElementById('roleBody').addEventListener('click', function(e) {
    var id = e.target.dataset.id;
    if (!id) return;
    var r = roles.find(function(x) { return x.id === id; });
    if (!r) return;
    if (e.target.classList.contains('role-edit-btn')) openRoleModal(r);
    else if (e.target.classList.contains('role-perm-btn')) openRolePermModal(r);
    else if (e.target.classList.contains('role-delete-btn')) {
      if (confirm('确定删除角色 "' + r.role_name + '" 吗？')) {
        roles = roles.filter(function(x) { return x.id !== id; });
        renderRoles();
        showToast('角色已删除', 'success');
      }
    }
  });

  document.getElementById('addRoleBtn').addEventListener('click', function() { openRoleModal(null); });

  function openRoleModal(role) {
    editingRoleId = role ? role.id : null;
    document.getElementById('roleModalTitle').textContent = role ? '编辑角色' : '新建角色';
    document.getElementById('roleFName').value = role ? role.role_name : '';
    document.getElementById('roleFCode').value = role ? role.role_code : '';
    document.getElementById('roleFCode').disabled = !!role;
    document.getElementById('roleFDesc').value = role ? (role.description || '') : '';
    document.getElementById('roleFPermGroup').style.display = 'none';
    document.getElementById('roleModal').classList.add('show');
  }

  function openRolePermModal(role) {
    editingRoleId = role.id;
    document.getElementById('roleModalTitle').textContent = '权限配置 - ' + role.role_name;
    document.getElementById('roleFName').value = role.role_name;
    document.getElementById('roleFCode').value = role.role_code;
    document.getElementById('roleFCode').disabled = true;
    document.getElementById('roleFDesc').value = role.description || '';
    document.getElementById('roleFPermGroup').style.display = '';
    var box = document.getElementById('roleFPerms');
    box.innerHTML = allPermissions.map(function(p) {
      return '<label class="checkbox-item' + ((role.permissions || []).indexOf(p.code) !== -1 ? ' checked' : '') + '"><input type="checkbox" value="' + p.code + '">' + esc(p.label) + '</label>';
    }).join('');
    document.getElementById('roleModal').classList.add('show');
  }

  document.getElementById('roleModalSave').addEventListener('click', function() {
    var name = document.getElementById('roleFName').value.trim();
    var code = document.getElementById('roleFCode').value.trim();
    if (!name) { showToast('请输入角色名称', 'error'); return; }
    if (!code) { showToast('请输入角色编码', 'error'); return; }
    var isPermMode = document.getElementById('roleFPermGroup').style.display !== 'none';
    if (editingRoleId) {
      var r = roles.find(function(x) { return x.id === editingRoleId; });
      if (r) {
        r.role_name = name;
        r.description = document.getElementById('roleFDesc').value.trim();
        if (isPermMode) {
          var perms = [];
          document.querySelectorAll('#roleFPerms .checkbox-item.checked input').forEach(function(cb) { perms.push(cb.value); });
          r.permissions = perms;
        }
      }
    } else {
      if (roles.some(function(r) { return r.role_code === code; })) { showToast('角色编码已存在', 'error'); return; }
      roles.push({ id:'r' + (roles.length + 1), role_name:name, role_code:code, description:document.getElementById('roleFDesc').value.trim(), permissions:[] });
    }
    document.getElementById('roleModal').classList.remove('show');
    renderRoles();
    showToast(editingRoleId ? '角色已更新' : '角色已创建', 'success');
  });

  document.getElementById('roleModalClose').addEventListener('click', function() { document.getElementById('roleModal').classList.remove('show'); });
  document.getElementById('roleModalCancel').addEventListener('click', function() { document.getElementById('roleModal').classList.remove('show'); });
  document.getElementById('roleModal').addEventListener('click', function(e) { if (e.target === this) this.classList.remove('show'); });

  document.getElementById('roleFPerms').addEventListener('click', function(e) {
    var item = e.target.closest('.checkbox-item');
    if (item) {
      item.classList.toggle('checked');
      item.querySelector('input').checked = item.classList.contains('checked');
    }
  });

  // ===== Departments =====
  function renderDepts() {
    var q = (document.getElementById('deptSearch').value || '').toLowerCase();
    var filtered = q ? depts.filter(function(d) { return d.name.toLowerCase().indexOf(q) !== -1; }) : depts;
    var tbody = document.getElementById('deptBody');
    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5"><div class="empty-state"><p>暂无匹配部门</p></div></td></tr>';
    } else {
      tbody.innerHTML = filtered.map(function(d) {
        return '<tr><td style="font-weight:500">' + esc(d.name) + '</td>' +
          '<td>' + (d.parent_name || '—') + '</td>' +
          '<td>' + (d.leader_name || '—') + '</td>' +
          '<td>' + d.sort_order + '</td>' +
          '<td><div class="actions-cell"><button class="btn btn-outline btn-xs dept-edit-btn" data-id="' + d.id + '">编辑</button><button class="btn btn-danger btn-xs dept-delete-btn" data-id="' + d.id + '">删除</button></div></td></tr>';
      }).join('');
    }
    document.getElementById('deptTotal').textContent = '共 ' + depts.length + ' 条';
  }

  document.getElementById('deptSearch').addEventListener('input', renderDepts);

  document.getElementById('deptBody').addEventListener('click', function(e) {
    var id = e.target.dataset.id;
    if (!id) return;
    var d = depts.find(function(x) { return x.id === id; });
    if (!d) return;
    if (e.target.classList.contains('dept-edit-btn')) openDeptModal(d);
    else if (e.target.classList.contains('dept-delete-btn')) {
      if (confirm('确定删除部门 "' + d.name + '" 吗？')) {
        depts = depts.filter(function(x) { return x.id !== id; });
        renderDepts();
        showToast('部门已删除', 'success');
      }
    }
  });

  document.getElementById('addDeptBtn').addEventListener('click', function() { openDeptModal(null); });

  function openDeptModal(dept) {
    editingDeptId = dept ? dept.id : null;
    document.getElementById('deptModalTitle').textContent = dept ? '编辑部门' : '新建部门';
    document.getElementById('deptFName').value = dept ? dept.name : '';
    // Parent
    var sel1 = document.getElementById('deptFParent');
    sel1.innerHTML = '<option value="">-- 无 --</option>' + depts.filter(function(d) { return d.id !== editingDeptId; }).map(function(d) { return '<option value="' + d.id + '">' + esc(d.name) + '</option>'; }).join('');
    sel1.value = dept ? (dept.parent_id || '') : '';
    // Leader
    var sel2 = document.getElementById('deptFLeader');
    sel2.innerHTML = '<option value="">-- 无 --</option>' + users.map(function(u) { return '<option value="' + u.id + '">' + esc(u.display_name || u.username) + '</option>'; }).join('');
    sel2.value = dept ? (dept.leader_id || '') : '';
    document.getElementById('deptFSort').value = dept ? dept.sort_order : 0;
    document.getElementById('deptModal').classList.add('show');
  }

  document.getElementById('deptModalSave').addEventListener('click', function() {
    var name = document.getElementById('deptFName').value.trim();
    if (!name) { showToast('请输入部门名称', 'error'); return; }
    var parentId = document.getElementById('deptFParent').value;
    var parent = depts.find(function(d) { return d.id === parentId; });
    var leaderId = document.getElementById('deptFLeader').value;
    var leader = users.find(function(u) { return u.id === leaderId; });
    if (editingDeptId) {
      var d = depts.find(function(x) { return x.id === editingDeptId; });
      if (d) {
        d.name = name;
        d.parent_id = parentId;
        d.parent_name = parent ? parent.name : '';
        d.leader_id = leaderId;
        d.leader_name = leader ? (leader.display_name || leader.username) : '';
        d.sort_order = parseInt(document.getElementById('deptFSort').value) || 0;
      }
    } else {
      depts.push({ id:'d' + (depts.length + 1), parent_id:parentId, parent_name:parent ? parent.name : '', name:name, leader_id:leaderId, leader_name:leader ? (leader.display_name || leader.username) : '', sort_order:parseInt(document.getElementById('deptFSort').value) || 0 });
    }
    document.getElementById('deptModal').classList.remove('show');
    renderDepts();
    showToast(editingDeptId ? '部门已更新' : '部门已创建', 'success');
  });

  document.getElementById('deptModalClose').addEventListener('click', function() { document.getElementById('deptModal').classList.remove('show'); });
  document.getElementById('deptModalCancel').addEventListener('click', function() { document.getElementById('deptModal').classList.remove('show'); });
  document.getElementById('deptModal').addEventListener('click', function(e) { if (e.target === this) this.classList.remove('show'); });

  // ===== Shared =====
  function renderPagination(cid, totalPages, current, cb) {
    var btn = document.getElementById(cid);
    if (totalPages <= 1) { btn.innerHTML = ''; return; }
    btn.innerHTML = '<div class="pagination-info">第 ' + current + '/' + totalPages + ' 页</div><div class="pagination-btns"><button ' + (current === 1 ? 'disabled' : '') + ' data-page="' + (current - 1) + '">&laquo;</button>';
    var sp = Math.max(1, Math.min(current - 2, totalPages - 4));
    var ep = Math.min(totalPages, Math.max(current + 2, 5));
    if (sp > 1) btn.innerHTML += '<button data-page="1">1</button><span style="color:var(--text-muted);padding:0 4px">…</span>';
    for (var p = sp; p <= ep; p++) btn.innerHTML += '<button class="' + (p === current ? 'active' : '') + '" data-page="' + p + '">' + p + '</button>';
    if (ep < totalPages) btn.innerHTML += '<span style="color:var(--text-muted);padding:0 4px">…</span><button data-page="' + totalPages + '">' + totalPages + '</button>';
    btn.innerHTML += '<button ' + (current === totalPages ? 'disabled' : '') + ' data-page="' + (current + 1) + '">&raquo;</button></div>';
    btn.addEventListener('click', function(e) { if (e.target.tagName === 'BUTTON' && !e.target.disabled) cb(parseInt(e.target.dataset.page)); }, { once: true });
  }

  function showToast(msg, type) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast ' + type + ' show';
    clearTimeout(t._timer); t._timer = setTimeout(function() { t.classList.remove('show'); }, 2500);
  }

  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  renderUsers();
  renderRoles();
  renderDepts();
})();
</script>
</body>
</html>
