<script>
(function() {
  // Auth check
  var tokenData = sessionStorage.getItem('kb_token') || localStorage.getItem('kb_token');
  if (!tokenData) { window.location.replace('login.html'); return; }

  // Role-based sidebar visibility
  var userData = getUserData(tokenData);
  if (userData) {
    var roles = userData.roles || [];
    if (roles.indexOf('super_admin') === -1) {
      var navSettlement = document.getElementById('navSettlement');
      var navAdmin = document.getElementById('navAdmin');
      var navDivider1 = document.getElementById('navDivider1');
      var navDivider2 = document.getElementById('navDivider2');
      if (roles.indexOf('knowledge_admin') !== -1) {
        if (navAdmin) navAdmin.style.display = 'none';
      } else {
        if (navDivider1) navDivider1.style.display = 'none';
        if (navSettlement) navSettlement.style.display = 'none';
        if (navDivider2) navDivider2.style.display = 'none';
        if (navAdmin) navAdmin.style.display = 'none';
      }
    }
    var avatar = document.querySelector('.user-avatar');
    var nameEl = document.querySelector('.user-name');
    var roleEl = document.querySelector('.user-role');
    if (nameEl) nameEl.textContent = userData.display_name || userData.username || '';
    if (avatar && nameEl) avatar.textContent = (nameEl.textContent || 'U').charAt(0);
    if (roleEl) {
      if (roles.indexOf('super_admin') !== -1) roleEl.textContent = '系统管理员';
      else if (roles.indexOf('knowledge_admin') !== -1) roleEl.textContent = '知识管理员';
      else roleEl.textContent = '普通用户';
    }
    document.getElementById('popupAvatar').textContent = (userData.display_name || userData.username || 'U').charAt(0);
    document.getElementById('popupName').textContent = userData.display_name || userData.username || '';
    document.getElementById('popupRole').textContent = roleEl ? roleEl.textContent : '';
    document.getElementById('popupUsername').textContent = userData.username || '';
    document.getElementById('popupEmail').textContent = userData.email || '未设置';
    document.getElementById('popupDept').textContent = userData.department_name || '未设置';
  }

  // User popup
  var userCard = document.querySelector('.user-card');
  var userPopup = document.getElementById('userPopup');
  var userPopupOverlay = document.getElementById('userPopupOverlay');

  function showPopup() {
    var rect = userCard.getBoundingClientRect();
    userPopup.style.left = Math.min(rect.left, window.innerWidth - 296) + 'px';
    userPopup.style.bottom = (window.innerHeight - rect.top + 8) + 'px';
    userPopup.classList.add('show');
    userPopupOverlay.classList.add('show');
  }

  function hidePopup() {
    userPopup.classList.remove('show');
    userPopupOverlay.classList.remove('show');
  }

  userCard.addEventListener('click', function(e) {
    e.stopPropagation();
    if (userPopup.classList.contains('show')) { hidePopup(); } else { showPopup(); }
  });

  userPopupOverlay.addEventListener('click', hidePopup);

  document.getElementById('popupSettings').addEventListener('click', function() {
    hidePopup();
    window.location.href = 'settings.html';
  });

  function getUserData(raw) {
    try { var d = JSON.parse(raw); return d.user || d; } catch(e) { return null; }
  }

  // Logout
  document.getElementById('popupLogout').addEventListener('click', function() {
    hidePopup();
    sessionStorage.removeItem('kb_token');
    localStorage.removeItem('kb_token');
    window.location.replace('login.html');
  });

  // Time range switcher
  var timeBtns = document.querySelectorAll('#timeRange .time-range-btn');
  timeBtns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      timeBtns.forEach(function(b) { b.classList.remove('active'); });
      this.classList.add('active');
      updateMetrics(this.dataset.range);
    });
  });

  // Mock data by range
  var mockData = {
    today:   { visits: 423,   users: 87,  units: 2156, tokens: '128K', response: 412, visitsUp: 5, usersUp: 3, unitsNew: 0, tokensUp: 2, responseDown: 12 },
    week:    { visits: 2984,  users: 215, units: 2156, tokens: '892K', response: 456, visitsUp: 8, usersUp: 6, unitsNew: 8, tokensUp: 10, responseDown: 5 },
    month:   { visits: 12847, users: 346, units: 2156, tokens: '3.2M', response: 486, visitsUp: 12, usersUp: 8, unitsNew: 23, tokensUp: 15, responseDown: 8 }
  };

  function updateMetrics(range) {
    var d = mockData[range];
    document.getElementById('metricVisits').textContent = d.visits.toLocaleString();
    document.getElementById('metricUsers').textContent = d.users.toLocaleString();
    document.getElementById('metricUnits').textContent = d.units.toLocaleString();
    document.getElementById('metricTokens').textContent = d.tokens;
    document.getElementById('metricResponse').textContent = d.response + 'ms';
    // Update sub texts
    var subs = document.querySelectorAll('.metric-sub');
    subs[0].innerHTML = '<span class="up">↑ ' + d.visitsUp + '%</span> 较上期';
    subs[1].innerHTML = '<span class="up">↑ ' + d.usersUp + '%</span> 较上期';
    subs[2].innerHTML = '<span class="up">↑ ' + d.unitsNew + '</span> ' + (range === 'today' ? '今日' : '本期') + '新增';
    subs[3].innerHTML = '<span class="up">↑ ' + d.tokensUp + '%</span> 较上期';
    subs[4].innerHTML = '<span class="down">↓ ' + d.responseDown + '%</span> 较上期';
  }

  // ===== Token Trends Chart =====
  var tokenChart = echarts.init(document.getElementById('chartToken'), null, { renderer: 'svg' });
  var tokenDates = [];
  var tokenValues = [];
  var tokenRequests = [];
  var now = new Date();
  for (var i = 29; i >= 0; i--) {
    var d = new Date(now);
    d.setDate(d.getDate() - i);
    tokenDates.push((d.getMonth() + 1) + '/' + d.getDate());
    tokenValues.push(Math.floor(80000 + Math.random() * 60000));
    tokenRequests.push(Math.floor(300 + Math.random() * 200));
  }

  tokenChart.setOption({
    animation: false,
    tooltip: {
      trigger: 'axis',
      appendToBody: true,
      backgroundColor: '#fff',
      borderColor: '#E8EAED',
      textStyle: { color: '#1A1A1A', fontSize: 13 }
    },
    legend: {
      bottom: 0,
      textStyle: { color: '#5F6368', fontSize: 12 },
      itemWidth: 12,
      itemHeight: 8
    },
    grid: { left: 50, right: 50, top: 20, bottom: 40 },
    xAxis: {
      type: 'category',
      data: tokenDates,
      axisLine: { lineStyle: { color: '#E8EAED' } },
      axisTick: { show: false },
      axisLabel: { color: '#9AA0A6', fontSize: 11, interval: 4 }
    },
    yAxis: [
      {
        type: 'value',
        name: 'Token',
        nameTextStyle: { color: '#9AA0A6', fontSize: 11 },
        axisLabel: { color: '#9AA0A6', fontSize: 11, formatter: function(v) { return (v / 1000).toFixed(0) + 'K'; } },
        splitLine: { lineStyle: { color: '#F1F3F4' } }
      },
      {
        type: 'value',
        name: '请求数',
        nameTextStyle: { color: '#9AA0A6', fontSize: 11 },
        axisLabel: { color: '#9AA0A6', fontSize: 11 },
        splitLine: { show: false }
      }
    ],
    series: [
      {
        name: 'Token 消耗',
        type: 'line',
        smooth: true,
        data: tokenValues,
        symbol: 'circle',
        symbolSize: 4,
        lineStyle: { color: '#263238', width: 2 },
        itemStyle: { color: '#263238' },
        areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
          { offset: 0, color: 'rgba(38,50,56,0.12)' },
          { offset: 1, color: 'rgba(38,50,56,0)' }
        ])}
      },
      {
        name: '请求数',
        type: 'line',
        smooth: true,
        yAxisIndex: 1,
        data: tokenRequests,
        symbol: 'circle',
        symbolSize: 4,
        lineStyle: { color: '#4285F4', width: 2 },
        itemStyle: { color: '#4285F4' }
      }
    ]
  });

  window.addEventListener('resize', function() { tokenChart.resize(); });

  // ===== Question Rankings =====
  var questionChart = echarts.init(document.getElementById('chartQuestions'), null, { renderer: 'svg' });
  var questions = [
    '如何配置部门权限', '支持导入哪些文件格式', 'API 接口文档在哪里',
    '上传文档解析失败怎么办', '数据看板支持哪些指标', 'FAQ 自动挖掘原理',
    '如何创建知识单元', 'JWT Token 过期怎么办', 'MinIO 存储配置',
    '用户角色怎么分配'
  ];
  var questionCounts = [486, 423, 398, 367, 341, 298, 275, 243, 218, 195];

  questionChart.setOption({
    animation: false,
    tooltip: {
      trigger: 'axis',
      appendToBody: true,
      axisPointer: { type: 'shadow' },
      backgroundColor: '#fff',
      borderColor: '#E8EAED',
      textStyle: { color: '#1A1A1A', fontSize: 13 }
    },
    grid: { left: 10, right: 40, top: 0, bottom: 0 },
    xAxis: {
      type: 'value',
      axisLabel: { color: '#9AA0A6', fontSize: 11 },
      splitLine: { lineStyle: { color: '#F1F3F4' } },
      axisLine: { show: false },
      axisTick: { show: false }
    },
    yAxis: {
      type: 'category',
      inverse: true,
      data: questions,
      axisLabel: { color: '#1A1A1A', fontSize: 12, width: 140, overflow: 'truncate' },
      axisLine: { show: false },
      axisTick: { show: false }
    },
    series: [{
      type: 'bar',
      data: questionCounts,
      barWidth: 14,
      itemStyle: {
        color: '#263238',
        borderRadius: [0, 4, 4, 0]
      },
      label: {
        show: true,
        position: 'right',
        color: '#5F6368',
        fontSize: 11,
        formatter: function(p) { return p.value; }
      }
    }]
  });

  window.addEventListener('resize', function() { questionChart.resize(); });

  // ===== Unit Rankings =====
  var unitChart = echarts.init(document.getElementById('chartUnits'), null, { renderer: 'svg' });
  var units = [
    '权限管理操作手册', '产品发布流程文档', 'API 接口规范 v2.1',
    '数据看板使用指南', 'FAQ 管理后台说明', '系统部署运维手册',
    '知识单元导入指南', '用户角色与权限体系', 'MinIO 对象存储配置',
    'RAG 检索优化方案'
  ];
  var unitCounts = [326, 298, 287, 254, 231, 209, 186, 172, 158, 134];

  unitChart.setOption({
    animation: false,
    tooltip: {
      trigger: 'axis',
      appendToBody: true,
      axisPointer: { type: 'shadow' },
      backgroundColor: '#fff',
      borderColor: '#E8EAED',
      textStyle: { color: '#1A1A1A', fontSize: 13 }
    },
    grid: { left: 10, right: 40, top: 0, bottom: 0 },
    xAxis: {
      type: 'value',
      axisLabel: { color: '#9AA0A6', fontSize: 11 },
      splitLine: { lineStyle: { color: '#F1F3F4' } },
      axisLine: { show: false },
      axisTick: { show: false }
    },
    yAxis: {
      type: 'category',
      inverse: true,
      data: units,
      axisLabel: { color: '#1A1A1A', fontSize: 12, width: 140, overflow: 'truncate' },
      axisLine: { show: false },
      axisTick: { show: false }
    },
    series: [{
      type: 'bar',
      data: unitCounts,
      barWidth: 14,
      itemStyle: {
        color: '#4285F4',
        borderRadius: [0, 4, 4, 0]
      },
      label: {
        show: true,
        position: 'right',
        color: '#5F6368',
        fontSize: 11,
        formatter: function(p) { return p.value; }
      }
    }]
  });

  window.addEventListener('resize', function() { unitChart.resize(); });
})();
</script>
</body>
</html>
