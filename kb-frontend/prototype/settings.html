<script>
(function() {
  var tokenData = sessionStorage.getItem('kb_token') || localStorage.getItem('kb_token');
  if (!tokenData) { window.location.replace('login.html'); return; }

  var userData = getUserData(tokenData);
  if (!userData) { window.location.replace('login.html'); return; }

  var roles = userData.roles || [];

  // Role-based sidebar visibility
  if (roles.indexOf('super_admin') === -1) {
    var navSettlement = document.getElementById('navSettlement');
    var navAdmin = document.getElementById('navAdmin');
    var navDivider1 = document.getElementById('navDivider1');
    var navDivider2 = document.getElementById('navDivider2');
    if (roles.indexOf('knowledge_admin') !== -1) {
      if (navAdmin) navAdmin.style.display = 'none';
    } else {
      if (navDivider1) navDivider1.style.display = 'none';
      if (navSettlement) navSettlement.style.display = 'none';
      if (navDivider2) navDivider2.style.display = 'none';
      if (navAdmin) navAdmin.style.display = 'none';
    }
  }

  // Update user card
  var avatar = document.querySelector('.user-avatar');
  var nameEl = document.querySelector('.user-name');
  var roleEl = document.querySelector('.user-role');
  if (nameEl) nameEl.textContent = userData.display_name || userData.username || '';
  if (avatar && nameEl) avatar.textContent = (nameEl.textContent || 'U').charAt(0);
  if (roleEl) {
    if (roles.indexOf('super_admin') !== -1) roleEl.textContent = '系统管理员';
    else if (roles.indexOf('knowledge_admin') !== -1) roleEl.textContent = '知识管理员';
    else roleEl.textContent = '普通用户';
  }

  // Populate popup data
  document.getElementById('popupAvatar').textContent = (userData.display_name || userData.username || 'U').charAt(0);
  document.getElementById('popupName').textContent = userData.display_name || userData.username || '';
  document.getElementById('popupRole').textContent = roleEl ? roleEl.textContent : '';
  document.getElementById('popupUsername').textContent = userData.username || '';
  document.getElementById('popupEmail').textContent = userData.email || '未设置';
  document.getElementById('popupDept').textContent = userData.department_name || '未设置';

  // User popup
  var userCard = document.querySelector('.user-card');
  var userPopup = document.getElementById('userPopup');
  var userPopupOverlay = document.getElementById('userPopupOverlay');

  function showPopup() {
    var rect = userCard.getBoundingClientRect();
    userPopup.style.left = Math.min(rect.left, window.innerWidth - 296) + 'px';
    userPopup.style.bottom = (window.innerHeight - rect.top + 8) + 'px';
    userPopup.classList.add('show');
    userPopupOverlay.classList.add('show');
  }

  function hidePopup() {
    userPopup.classList.remove('show');
    userPopupOverlay.classList.remove('show');
  }

  userCard.addEventListener('click', function(e) {
    e.stopPropagation();
    if (userPopup.classList.contains('show')) { hidePopup(); } else { showPopup(); }
  });

  userPopupOverlay.addEventListener('click', hidePopup);

  document.getElementById('popupSettings').addEventListener('click', function() {
    hidePopup();
  });

  // Fill form fields
  document.getElementById('fieldUsername').value = userData.username || '';
  document.getElementById('fieldDisplayName').value = userData.display_name || '';
  document.getElementById('fieldEmail').value = userData.email || '';
  document.getElementById('fieldDept').value = userData.department_name || '未设置';

  // Toast
  var toast = document.getElementById('toast');
  function showToast(msg, type) {
    toast.textContent = msg;
    toast.className = 'toast ' + type + ' show';
    clearTimeout(toast._timer);
    toast._timer = setTimeout(function() { toast.classList.remove('show'); }, 3000);
  }

  // Cancel
  document.getElementById('btnCancel').addEventListener('click', function() {
    history.back();
  });

  // Save
  document.getElementById('btnSave').addEventListener('click', async function() {
    var displayName = document.getElementById('fieldDisplayName').value.trim();
    var email = document.getElementById('fieldEmail').value.trim();
    var oldPwd = document.getElementById('fieldOldPwd').value;
    var newPwd = document.getElementById('fieldNewPwd').value;
    var newPwd2 = document.getElementById('fieldNewPwd2').value;

    if (!displayName) { showToast('请输入显示名称', 'error'); return; }

    // API base URL — use relative path (same origin in dev) or configurable
    var baseUrl = window.API_BASE_URL || '';

    var headers = {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + getAccessToken(tokenData)
    };

    var btnSave = document.getElementById('btnSave');
    btnSave.disabled = true;
    btnSave.textContent = '保存中...';

    try {
      // 1. Update profile
      var profileResp = await fetch(baseUrl + '/api/auth/profile', {
        method: 'PUT',
        headers: headers,
        body: JSON.stringify({ display_name: displayName, email: email })
      });

      if (!profileResp.ok) {
        var errData = await profileResp.json().catch(function() { return {}; });
        throw new Error(errData.detail || '保存个人信息失败');
      }

      var updatedUser = await profileResp.json();

      // 2. Change password if requested
      if (oldPwd || newPwd || newPwd2) {
        if (!oldPwd) { throw new Error('请输入当前密码'); }
        if (!newPwd) { throw new Error('请输入新密码'); }
        if (newPwd.length < 6) { throw new Error('新密码至少 6 位'); }
        if (newPwd !== newPwd2) { throw new Error('两次新密码不一致'); }

        var pwdResp = await fetch(baseUrl + '/api/auth/change-password', {
          method: 'POST',
          headers: headers,
          body: JSON.stringify({
            old_password: oldPwd,
            new_password: newPwd,
            confirm_password: newPwd2
          })
        });

        if (!pwdResp.ok) {
          var pwdErr = await pwdResp.json().catch(function() { return {}; });
          throw new Error(pwdErr.detail || '密码修改失败');
        }
      }

      // Update stored user data
      userData.display_name = updatedUser.display_name;
      userData.email = updatedUser.email;

      var storedToken = JSON.parse(tokenData);
      if (storedToken.user) {
        storedToken.user.display_name = updatedUser.display_name;
        storedToken.user.email = updatedUser.email;
      } else {
        storedToken.display_name = updatedUser.display_name;
        storedToken.email = updatedUser.email;
      }

      var raw = JSON.stringify(storedToken);
      if (sessionStorage.getItem('kb_token')) sessionStorage.setItem('kb_token', raw);
      if (localStorage.getItem('kb_token')) localStorage.setItem('kb_token', raw);

      // Update UI
      if (nameEl) nameEl.textContent = updatedUser.display_name;
      if (avatar && nameEl) avatar.textContent = (updatedUser.display_name || 'U').charAt(0);
      document.getElementById('popupAvatar').textContent = (updatedUser.display_name || 'U').charAt(0);
      document.getElementById('popupName').textContent = updatedUser.display_name;
      document.getElementById('popupEmail').textContent = updatedUser.email || '未设置';

      // Clear password fields
      document.getElementById('fieldOldPwd').value = '';
      document.getElementById('fieldNewPwd').value = '';
      document.getElementById('fieldNewPwd2').value = '';

      showToast('保存成功', 'success');
    } catch (e) {
      showToast(e.message, 'error');
    } finally {
      btnSave.disabled = false;
      btnSave.textContent = '保存修改';
    }
  });

  function getAccessToken(raw) {
    try { var d = JSON.parse(raw); return d.access_token || ''; } catch(e) { return ''; }
  }

  // Logout
  document.getElementById('popupLogout').addEventListener('click', function() {
    hidePopup();
    sessionStorage.removeItem('kb_token');
    localStorage.removeItem('kb_token');
    window.location.replace('login.html');
  });

  function getUserData(raw) {
    try { var d = JSON.parse(raw); return d.user || d; } catch(e) { return null; }
  }
})();
</script>

</body>
</html>
