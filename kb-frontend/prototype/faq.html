    <div class="modal-header"><h3>审核 FAQ</h3><button class="modal-close" id="reviewClose">&times;</button></div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">问题</label><div style="font-size:14px;color:var(--text);font-weight:500" id="reviewQuestion"></div></div>
      <div class="form-group"><label class="form-label">答案</label><textarea class="form-textarea" id="reviewAnswer" rows="6"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger" id="reviewRejectBtn">驳回</button>
      <button class="btn btn-success" id="reviewApproveBtn">通过并发布</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function() {
  var tokenData = sessionStorage.getItem('kb_token') || localStorage.getItem('kb_token');
  if (!tokenData) { window.location.replace('login.html'); return; }

  // Role-based sidebar visibility
  var userData = getUserData(tokenData);
  if (userData) {
    var roles = userData.roles || [];
    if (roles.indexOf('super_admin') === -1) {
      var navSettlement = document.getElementById('navSettlement');
      var navAdmin = document.getElementById('navAdmin');
      var navDivider1 = document.getElementById('navDivider1');
      var navDivider2 = document.getElementById('navDivider2');
      if (roles.indexOf('knowledge_admin') !== -1) {
        if (navAdmin) navAdmin.style.display = 'none';
      } else {
        if (navDivider1) navDivider1.style.display = 'none';
        if (navSettlement) navSettlement.style.display = 'none';
        if (navDivider2) navDivider2.style.display = 'none';
        if (navAdmin) navAdmin.style.display = 'none';
      }
    }
    var avatar = document.querySelector('.user-avatar');
    var nameEl = document.querySelector('.user-name');
    var roleEl = document.querySelector('.user-role');
    if (nameEl) nameEl.textContent = userData.display_name || userData.username || '';
    if (avatar && nameEl) avatar.textContent = (nameEl.textContent || 'U').charAt(0);
    if (roleEl) {
      if (roles.indexOf('super_admin') !== -1) roleEl.textContent = '系统管理员';
      else if (roles.indexOf('knowledge_admin') !== -1) roleEl.textContent = '知识管理员';
      else roleEl.textContent = '普通用户';
    }
    document.getElementById('popupAvatar').textContent = (userData.display_name || userData.username || 'U').charAt(0);
    document.getElementById('popupName').textContent = userData.display_name || userData.username || '';
    document.getElementById('popupRole').textContent = roleEl ? roleEl.textContent : '';
    document.getElementById('popupUsername').textContent = userData.username || '';
    document.getElementById('popupEmail').textContent = userData.email || '未设置';
    document.getElementById('popupDept').textContent = userData.department_name || '未设置';
  }

  // User popup
  var userCard = document.querySelector('.user-card');
  var userPopup = document.getElementById('userPopup');
  var userPopupOverlay = document.getElementById('userPopupOverlay');

  function showPopup() {
    var rect = userCard.getBoundingClientRect();
    userPopup.style.left = Math.min(rect.left, window.innerWidth - 296) + 'px';
    userPopup.style.bottom = (window.innerHeight - rect.top + 8) + 'px';
    userPopup.classList.add('show');
    userPopupOverlay.classList.add('show');
  }

  function hidePopup() {
    userPopup.classList.remove('show');
    userPopupOverlay.classList.remove('show');
  }

  userCard.addEventListener('click', function(e) {
    e.stopPropagation();
    if (userPopup.classList.contains('show')) { hidePopup(); } else { showPopup(); }
  });

  userPopupOverlay.addEventListener('click', hidePopup);

  document.getElementById('popupSettings').addEventListener('click', function() {
    hidePopup();
    window.location.href = 'settings.html';
  });

  function getUserData(raw) {
    try { var d = JSON.parse(raw); return d.user || d; } catch(e) { return null; }
  }

  document.getElementById('popupLogout').addEventListener('click', function() {
    hidePopup();
    sessionStorage.removeItem('kb_token'); localStorage.removeItem('kb_token');
    window.location.replace('login.html');
  });

  var recData = [
    { id:'r1', question:'如何配置部门的数据权限？', answer:'进入知识管理 → 选择目标知识单元 → 点击"权限配置" → 添加权限规则，选择目标类型为"部门"，选择具体部门后保存。', category:'操作手册', related_unit_id:'unit_0001', related_unit_title:'权限管理操作手册', source_type:'auto_mined', hit_count:486, status:'pending_review' },
    { id:'r2', question:'支持哪些文件格式导入？', answer:'目前支持 PDF(50MB)、DOCX(20MB)、MD(5MB)、TXT(5MB) 四种格式。PDF 超过 50MB 会自动拆分为子文件处理。', category:'技术文档', related_unit_id:'unit_0010', related_unit_title:'知识单元导入指南', source_type:'auto_mined', hit_count:423, status:'pending_review' },
    { id:'r3', question:'JWT Token 过期了怎么处理？', answer:'使用 refresh_token 调用 /api/auth/refresh 接口获取新的 access_token。access_token 有效期 8 小时，refresh_token 有效期 7 天。', category:'技术文档', related_unit_id:'unit_0012', related_unit_title:'JWT 认证流程文档', source_type:'auto_mined', hit_count:243, status:'pending_review' },
    { id:'r4', question:'MinIO 存储配置在哪里修改？', answer:'MinIO 配置通过环境变量设置：MINIO_ENDPOINT、MINIO_ACCESS_KEY、MINIO_SECRET_KEY、MINIO_BUCKET。可在 .env 文件中修改。', category:'技术文档', related_unit_id:'unit_0009', related_unit_title:'MinIO 对象存储配置说明', source_type:'auto_mined', hit_count:218, status:'pending_review' },
    { id:'r5', question:'数据分析看板的 Token 趋势图怎么看？', answer:'Token 趋势图展示每日 Token 消耗量与请求数的双轴折线图，支持切换今天/近7天/近30天查看。数据来源于 QAAccessLog 表。', category:'产品文档', related_unit_id:'unit_0005', related_unit_title:'数据看板使用指南', source_type:'auto_mined', hit_count:187, status:'pending_review' },
  ];
  var pubData = [
    { id:'p1', question:'系统支持哪些角色？', answer:'系统内置三种角色：系统管理员（全局权限）、知识管理员（知识管理权限）、普通用户（基础问答权限）。可通过系统管理页面分配角色。', category:'管理制度', source_type:'manual', hit_count:312, cache_active:true, reviewer_id:'admin', reviewed_at:'2026-08-10', created_at:'2026-08-01' },
    { id:'p2', question:'如何创建知识单元？', answer:'进入知识管理页面 → 点击"导入文档"按钮 → 选择文件上传。系统会自动解析文档内容、切片、向量化并存入知识库。', category:'操作手册', source_type:'auto_mined', hit_count:275, cache_active:true, reviewer_id:'admin', reviewed_at:'2026-08-12', created_at:'2026-08-05' },
    { id:'p3', question:'RAG 检索流程是怎样的？', answer:'用户提问 → Embedding 向量化 → Milvus 向量检索 TopK*3 → 权限过滤 → Rerank 重排序 → 取 TopK → 拼接上下文 → LLM 生成回答。', category:'技术文档', source_type:'manual', hit_count:198, cache_active:true, reviewer_id:'admin', reviewed_at:'2026-08-08', created_at:'2026-08-03' },
    { id:'p4', question:'上传文档解析失败怎么办？', answer:'首先检查文件格式是否支持（PDF/DOCX/MD/TXT），确认文件大小未超限。PDF 扫描件需要 PaddleOCR 或 Unlimited-OCR 服务可用。如仍失败，查看 Celery 任务日志排查。', category:'操作手册', source_type:'auto_mined', hit_count:367, cache_active:true, reviewer_id:'admin', reviewed_at:'2026-08-15', created_at:'2026-08-07' },
    { id:'p5', question:'如何给用户分配角色？', answer:'进入系统管理 → 用户管理 → 找到目标用户 → 点击"编辑角色" → 勾选对应角色后保存。', category:'管理制度', source_type:'manual', hit_count:156, cache_active:false, reviewer_id:'admin', reviewed_at:'2026-08-09', created_at:'2026-08-02' },
  ];

  var currentTab = 'recommendations';
  var recPage = 1, pubPage = 1;
  var pageSize = 10;

  document.querySelectorAll('.tab-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
      this.classList.add('active');
      currentTab = this.dataset.tab;
      document.getElementById('panelRecommendations').style.display = currentTab === 'recommendations' ? '' : 'none';
      document.getElementById('panelPublished').style.display = currentTab === 'published' ? '' : 'none';
      if (currentTab === 'recommendations') renderRecommendations();
      else renderPublished();
    });
  });

  function renderRecommendations() {
    var total = recData.length;
    var totalPages = Math.ceil(total / pageSize);
    if (recPage > totalPages) recPage = Math.max(1, totalPages);
    var start = (recPage - 1) * pageSize;
    var items = recData.slice(start, start + pageSize);
    var tbody = document.getElementById('recBody');
    if (items.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-5"/></svg><p>所有推荐已处理完毕</p></div></td></tr>';
    } else {
      tbody.innerHTML = items.map(function(item) {
        return '<tr><td><span class="cell-text" title="' + esc(item.question) + '">' + esc(item.question) + '</span></td>' +
          '<td><span class="cell-text" title="' + esc(item.answer) + '">' + esc(item.answer.substring(0, 50)) + '…</span></td>' +
          '<td><span class="cell-text" style="color:var(--info);cursor:pointer">' + item.related_unit_title + '</span></td>' +
          '<td><span class="cell-meta">' + item.hit_count + ' 次</span></td>' +
          '<td><span class="source-tag ' + item.source_type + '">' + (item.source_type === 'auto_mined' ? '自动挖掘' : '手动') + '</span></td>' +
          '<td><div class="actions-cell"><button class="btn btn-outline btn-xs review-btn" data-id="' + item.id + '">审核</button><button class="btn btn-danger btn-xs reject-btn" data-id="' + item.id + '">快速驳回</button></div></td></tr>';
      }).join('');
    }
    document.getElementById('recTotal').textContent = '共 ' + total + ' 条';
    document.getElementById('recCount').textContent = total;
    renderPagination('recPagination', totalPages, recPage, function(p) { recPage = p; renderRecommendations(); });
  }

  document.getElementById('recBody').addEventListener('click', function(e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    var id = btn.dataset.id;
    var item = recData.find(function(r) { return r.id === id; });
    if (!item) return;
    if (btn.classList.contains('review-btn')) { openReviewModal(item); }
    else if (btn.classList.contains('reject-btn')) {
      if (confirm('确定驳回该 FAQ 推荐吗？')) { recData = recData.filter(function(r) { return r.id !== id; }); renderRecommendations(); showToast('已驳回', 'success'); }
    }
  });

  var reviewItem = null;
  function openReviewModal(item) {
    reviewItem = item;
    document.getElementById('reviewQuestion').textContent = item.question;
    document.getElementById('reviewAnswer').value = item.answer;
    document.getElementById('reviewModal').classList.add('show');
  }
  document.getElementById('reviewClose').addEventListener('click', function() { document.getElementById('reviewModal').classList.remove('show'); });
  document.getElementById('reviewModal').addEventListener('click', function(e) { if (e.target === this) this.classList.remove('show'); });
  document.getElementById('reviewApproveBtn').addEventListener('click', function() {
    if (!reviewItem) return;
    var answer = document.getElementById('reviewAnswer').value.trim();
    if (!answer) { showToast('请填写答案', 'error'); return; }
    reviewItem.answer = answer;
    pubData.unshift({ id:reviewItem.id, question:reviewItem.question, answer:answer, category:reviewItem.category, source_type:reviewItem.source_type, hit_count:0, cache_active:true, reviewer_id:'admin', reviewed_at:new Date().toISOString().split('T')[0], created_at:new Date().toISOString().split('T')[0] });
    recData = recData.filter(function(r) { return r.id !== reviewItem.id; });
    document.getElementById('reviewModal').classList.remove('show');
    renderRecommendations(); renderPublished();
    showToast('已通过并发布到缓存', 'success');
  });
  document.getElementById('reviewRejectBtn').addEventListener('click', function() {
    if (!reviewItem) return;
    recData = recData.filter(function(r) { return r.id !== reviewItem.id; });
    document.getElementById('reviewModal').classList.remove('show');
    renderRecommendations();
    showToast('已驳回', 'success');
  });

  function renderPublished() {
    var total = pubData.length;
    var totalPages = Math.ceil(total / pageSize);
    if (pubPage > totalPages) pubPage = Math.max(1, totalPages);
    var start = (pubPage - 1) * pageSize;
    var items = pubData.slice(start, start + pageSize);
    var tbody = document.getElementById('pubBody');
    if (items.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="8" y1="12" x2="16" y2="12"/></svg><p>暂无已发布 FAQ</p></div></td></tr>';
    } else {
      tbody.innerHTML = items.map(function(item) {
        return '<tr><td><span class="cell-text" title="' + esc(item.question) + '">' + esc(item.question) + '</span></td>' +
          '<td><span class="cell-text" title="' + esc(item.answer) + '">' + esc(item.answer.substring(0, 50)) + '…</span></td>' +
          '<td>' + (item.category || '-') + '</td>' +
          '<td><span class="source-tag ' + item.source_type + '">' + (item.source_type === 'auto_mined' ? '自动挖掘' : '手动') + '</span></td>' +
          '<td><span class="cell-meta">' + item.hit_count + '</span></td>' +
          '<td><span class="cache-tag ' + (item.cache_active ? 'active' : 'inactive') + '">' + (item.cache_active ? '● 已生效' : '○ 未生效') + '</span></td>' +
          '<td><button class="btn btn-danger btn-xs pub-delete-btn" data-id="' + item.id + '">删除</button></td></tr>';
      }).join('');
    }
    document.getElementById('pubTotal').textContent = '共 ' + total + ' 条';
    document.getElementById('pubCount').textContent = total;
    renderPagination('pubPagination', totalPages, pubPage, function(p) { pubPage = p; renderPublished(); });
  }

  document.getElementById('pubBody').addEventListener('click', function(e) {
    if (e.target.classList.contains('pub-delete-btn')) {
      var id = e.target.dataset.id;
      if (confirm('确定删除该 FAQ 并清理缓存吗？')) { pubData = pubData.filter(function(r) { return r.id !== id; }); renderPublished(); showToast('已删除并清理缓存', 'success'); }
    }
  });

  document.getElementById('syncCacheBtn').addEventListener('click', function() {
    var count = pubData.filter(function(f) { return !f.cache_active; }).length;
    if (count === 0) { showToast('所有 FAQ 缓存已生效', 'success'); return; }
    pubData.forEach(function(f) { f.cache_active = true; });
    renderPublished();
    showToast('已同步 ' + count + ' 条到缓存', 'success');
  });

  function renderPagination(cid, totalPages, current, cb) {
    var btn = document.getElementById(cid);
    if (totalPages <= 1) { btn.innerHTML = ''; return; }
    btn.innerHTML = '<div class="pagination-info">第 ' + current + '/' + totalPages + ' 页</div><div class="pagination-btns"><button ' + (current === 1 ? 'disabled' : '') + ' data-page="' + (current - 1) + '">&laquo;</button>';
    var sp = Math.max(1, Math.min(current - 2, totalPages - 4));
    var ep = Math.min(totalPages, Math.max(current + 2, 5));
    if (sp > 1) btn.innerHTML += '<button data-page="1">1</button><span style="color:var(--text-muted);padding:0 4px">…</span>';
    for (var p = sp; p <= ep; p++) btn.innerHTML += '<button class="' + (p === current ? 'active' : '') + '" data-page="' + p + '">' + p + '</button>';
    if (ep < totalPages) btn.innerHTML += '<span style="color:var(--text-muted);padding:0 4px">…</span><button data-page="' + totalPages + '">' + totalPages + '</button>';
    btn.innerHTML += '<button ' + (current === totalPages ? 'disabled' : '') + ' data-page="' + (current + 1) + '">&raquo;</button></div>';
    btn.addEventListener('click', function(e) { if (e.target.tagName === 'BUTTON' && !e.target.disabled) cb(parseInt(e.target.dataset.page)); }, { once: true });
  }

  function showToast(msg, type) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast ' + type + ' show';
    clearTimeout(t._timer); t._timer = setTimeout(function() { t.classList.remove('show'); }, 2500);
  }

  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  renderRecommendations(); renderPublished();
})();
</script>
</body>
</html>
