<script>
(function() {
  // Auth
  var tokenData = sessionStorage.getItem('kb_token') || localStorage.getItem('kb_token');
  if (!tokenData) { window.location.replace('login.html'); return; }

  // Role-based sidebar visibility
  var userData = getUserData(tokenData);
  if (userData) {
    var roles = userData.roles || [];
    if (roles.indexOf('super_admin') === -1) {
      var navSettlement = document.getElementById('navSettlement');
      var navAdmin = document.getElementById('navAdmin');
      var navDivider1 = document.getElementById('navDivider1');
      var navDivider2 = document.getElementById('navDivider2');
      if (roles.indexOf('knowledge_admin') !== -1) {
        if (navAdmin) navAdmin.style.display = 'none';
      } else {
        if (navDivider1) navDivider1.style.display = 'none';
        if (navSettlement) navSettlement.style.display = 'none';
        if (navDivider2) navDivider2.style.display = 'none';
        if (navAdmin) navAdmin.style.display = 'none';
      }
    }
    var avatar = document.querySelector('.user-avatar');
    var nameEl = document.querySelector('.user-name');
    var roleEl = document.querySelector('.user-role');
    if (nameEl) nameEl.textContent = userData.display_name || userData.username || '';
    if (avatar && nameEl) avatar.textContent = (nameEl.textContent || 'U').charAt(0);
    if (roleEl) {
      if (roles.indexOf('super_admin') !== -1) roleEl.textContent = '系统管理员';
      else if (roles.indexOf('knowledge_admin') !== -1) roleEl.textContent = '知识管理员';
      else roleEl.textContent = '普通用户';
    }
    document.getElementById('popupAvatar').textContent = (userData.display_name || userData.username || 'U').charAt(0);
    document.getElementById('popupName').textContent = userData.display_name || userData.username || '';
    document.getElementById('popupRole').textContent = roleEl ? roleEl.textContent : '';
    document.getElementById('popupUsername').textContent = userData.username || '';
    document.getElementById('popupEmail').textContent = userData.email || '未设置';
    document.getElementById('popupDept').textContent = userData.department_name || '未设置';
  }

  // User popup
  var userCard = document.querySelector('.user-card');
  var userPopup = document.getElementById('userPopup');
  var userPopupOverlay = document.getElementById('userPopupOverlay');

  function showPopup() {
    var rect = userCard.getBoundingClientRect();
    userPopup.style.left = Math.min(rect.left, window.innerWidth - 296) + 'px';
    userPopup.style.bottom = (window.innerHeight - rect.top + 8) + 'px';
    userPopup.classList.add('show');
    userPopupOverlay.classList.add('show');
  }

  function hidePopup() {
    userPopup.classList.remove('show');
    userPopupOverlay.classList.remove('show');
  }

  userCard.addEventListener('click', function(e) {
    e.stopPropagation();
    if (userPopup.classList.contains('show')) { hidePopup(); } else { showPopup(); }
  });

  userPopupOverlay.addEventListener('click', hidePopup);

  document.getElementById('popupSettings').addEventListener('click', function() {
    hidePopup();
    window.location.href = 'settings.html';
  });

  function getUserData(raw) {
    try { var d = JSON.parse(raw); return d.user || d; } catch(e) { return null; }
  }

  // Logout (in user popup)
  document.getElementById('popupLogout').addEventListener('click', function() {
    hidePopup();
    sessionStorage.removeItem('kb_token');
    localStorage.removeItem('kb_token');
    window.location.replace('login.html');
  });

  // ===== Mock Data =====
  var mockData = [];
  var categories = ['技术文档', '操作手册', '产品文档', '管理制度', '其他'];
  var fileTypes = ['pdf', 'docx', 'md', 'txt'];
  var statuses = ['published', 'published', 'published', 'published', 'draft', 'deleted'];
  var titles = [
    '权限管理操作手册', '产品发布流程文档 v2.1', 'API 接口规范文档',
    '系统部署运维手册', '数据看板使用指南', 'FAQ 管理后台说明',
    '知识单元导入指南', '用户角色与权限体系设计', 'MinIO 对象存储配置说明',
    'RAG 检索优化方案', 'JWT 认证流程文档', 'PostgreSQL 数据库设计规范',
    'Redis 缓存使用指南', 'Docker 容器化部署指南', '代码审查规范',
    'CI/CD 流水线配置文档', '监控告警系统说明', '日志收集与分析方案',
    '备份恢复操作手册', '安全审计策略文档', '性能测试报告',
    'PaddleOCR 集成指南', 'Milvus 向量数据库配置', 'Celery 异步任务配置',
    'Nginx 反向代理配置', '前端开发规范', '后端开发规范',
    '单元测试编写指南', '知识缺口分析报告', '季度数据总结'
  ];

  for (var i = 0; i < 30; i++) {
    var d = new Date();
    d.setDate(d.getDate() - Math.floor(Math.random() * 90));
    var ft = fileTypes[Math.floor(Math.random() * fileTypes.length)];
    var sizes = [128, 256, 512, 1024, 2048, 3584, 5120, 8192];
    mockData.push({
      id: 'unit_' + String(i + 1).padStart(4, '0'),
      unit_code: 'KU-' + String(i + 1).padStart(6, '0'),
      title: titles[i],
      content: '这是' + titles[i] + '的详细内容。\n\n包含多个章节，涵盖操作步骤、注意事项和常见问题解答。\n\n## 1. 概述\n本文档说明了相关操作流程和配置方法。\n\n## 2. 详细步骤\n按照以下步骤进行操作...\n\n## 3. 注意事项\n请确保在操作前备份相关数据。',
      summary: titles[i] + '的简要说明，涵盖核心内容和适用范围。',
      category: categories[Math.floor(Math.random() * categories.length)],
      source_file_name: titles[i].replace(/[\/\\:*?"<>|]/g, '_') + '.' + ft,
      file_type: ft,
      file_size: sizes[Math.floor(Math.random() * sizes.length)],
      status: statuses[Math.floor(Math.random() * statuses.length)],
      creator_id: 'user_admin',
      created_at: d.toISOString().split('T')[0],
      updated_at: d.toISOString().split('T')[0],
      permissions: [
	        { id: 'p1', target_type: 'global', target_id: '', target_name: '所有人' },
	        { id: 'p2', target_type: 'department', target_id: 'dept-001', target_name: '技术部' },
	        { id: 'p3', target_type: 'role', target_id: 'knowledge_admin', target_name: '知识管理员' }
	      ]
    });
  }

  // ===== Mock Departments & Roles =====
  var mockDepartments = [
    { id: 'dept-001', name: '技术部' },
    { id: 'dept-002', name: '产品部' },
    { id: 'dept-003', name: '运营部' },
    { id: 'dept-004', name: '市场部' },
    { id: 'dept-005', name: '综合管理部' },
  ];

  var mockRoles = [
    { code: 'super_admin', name: '系统管理员' },
    { code: 'knowledge_admin', name: '知识管理员' },
    { code: 'user', name: '普通用户' },
  ];

  function getPermissionTargetName(p) {
    if (p.target_type === 'global') return '所有人';
    if (p.target_type === 'department') {
      var dept = mockDepartments.find(function(d) { return d.id === p.target_id; });
      return dept ? dept.name : (p.target_name || p.target_id || '--');
    }
    if (p.target_type === 'role') {
      var role = mockRoles.find(function(r) { return r.code === p.target_id; });
      return role ? role.name : (p.target_name || p.target_id || '--');
    }
    return p.target_name || p.target_id || '--';
  }

  // ===== State =====
  var currentPage = 1;
  var pageSize = 20;
  var searchQuery = '';
  var categoryFilter = '';
  var statusFilter = '';
  var selectedIds = new Set();
  var currentUnitId = null;

  // ===== Render =====
  function getFilteredData() {
    return mockData.filter(function(item) {
      if (searchQuery && !item.title.toLowerCase().includes(searchQuery.toLowerCase())) return false;
      if (categoryFilter && item.category !== categoryFilter) return false;
      if (statusFilter && item.status !== statusFilter) return false;
      return true;
    });
  }

  function renderTable() {
    var filtered = getFilteredData();
    var total = filtered.length;
    var totalPages = Math.ceil(total / pageSize);
    if (currentPage > totalPages) currentPage = Math.max(1, totalPages);
    var start = (currentPage - 1) * pageSize;
    var pageItems = filtered.slice(start, start + pageSize);

    var tbody = document.getElementById('tableBody');
    var statusMap = { published: '已发布', draft: '草稿', deleted: '已删除' };

    if (pageItems.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><p>没有找到匹配的知识单元</p></div></td></tr>';
    } else {
      tbody.innerHTML = pageItems.map(function(item) {
        var checked = selectedIds.has(item.id) ? 'checked' : '';
        return '<tr>' +
          '<td><input type="checkbox" class="row-checkbox" data-id="' + item.id + '" ' + checked + '></td>' +
          '<td><span class="cell-title" data-id="' + item.id + '">' + escapeHtml(item.title) + '</span><div class="cell-meta">' + item.unit_code + '</div></td>' +
          '<td>' + (item.category || '-') + '</td>' +
          '<td><span class="file-type-tag">' + item.file_type.toUpperCase() + '</span></td>' +
          '<td><span class="status-badge ' + item.status + '"><span class="status-dot"></span>' + (statusMap[item.status] || item.status) + '</span></td>' +
          '<td><span class="cell-meta">' + item.created_at + '</span></td>' +
          '<td><div class="actions-cell">' +
            '<button class="btn btn-outline btn-xs view-btn" data-id="' + item.id + '">查看</button>' +
            '<button class="btn btn-outline btn-xs edit-btn" data-id="' + item.id + '">编辑</button>' +
            '<button class="btn btn-danger btn-xs delete-btn" data-id="' + item.id + '">删除</button>' +
          '</div></td>' +
        '</tr>';
      }).join('');
    }

    document.getElementById('totalCount').textContent = '共 ' + total + ' 条';
    document.getElementById('selectAll').checked = false;

    // Pagination info
    var infoStart = total === 0 ? 0 : start + 1;
    var infoEnd = Math.min(start + pageSize, total);
    document.querySelector('.pagination-info').textContent = '显示 ' + infoStart + '-' + infoEnd + '，共 ' + total + ' 条';

    // Pagination buttons
    renderPagination(totalPages);

    // Update batch delete button
    updateBatchDelete();
  }

  function renderPagination(totalPages) {
    var btns = document.getElementById('pageBtns');
    if (totalPages <= 1) { btns.innerHTML = ''; return; }

    var html = '<button ' + (currentPage === 1 ? 'disabled' : '') + ' data-page="' + (currentPage - 1) + '">&laquo;</button>';
    var startPage = Math.max(1, Math.min(currentPage - 2, totalPages - 4));
    var endPage = Math.min(totalPages, Math.max(currentPage + 2, 5));
    if (startPage > 1) html += '<button data-page="1">1</button><span style="color:var(--text-muted);padding:0 4px">…</span>';
    for (var p = startPage; p <= endPage; p++) {
      html += '<button class="' + (p === currentPage ? 'active' : '') + '" data-page="' + p + '">' + p + '</button>';
    }
    if (endPage < totalPages) html += '<span style="color:var(--text-muted);padding:0 4px">…</span><button data-page="' + totalPages + '">' + totalPages + '</button>';
    html += '<button ' + (currentPage === totalPages ? 'disabled' : '') + ' data-page="' + (currentPage + 1) + '">&raquo;</button>';
    btns.innerHTML = html;
  }

  function updateBatchDelete() {
    var btn = document.getElementById('batchDeleteBtn');
    var count = selectedIds.size;
    btn.style.display = count > 0 ? 'inline-flex' : 'none';
    btn.textContent = '批量删除 (' + count + ')';
    document.getElementById('selectedCount').textContent = count > 0 ? '已选 ' + count + ' 项' : '';
  }

  // ===== Events =====
  document.getElementById('searchInput').addEventListener('input', function() {
    searchQuery = this.value;
    currentPage = 1;
    renderTable();
  });

  document.getElementById('categoryFilter').addEventListener('change', function() {
    categoryFilter = this.value;
    currentPage = 1;
    renderTable();
  });

  document.getElementById('statusFilter').addEventListener('change', function() {
    statusFilter = this.value;
    currentPage = 1;
    renderTable();
  });

  // Select all
  document.getElementById('selectAll').addEventListener('change', function() {
    var checked = this.checked;
    document.querySelectorAll('.row-checkbox[data-id]').forEach(function(cb) {
      cb.checked = checked;
      if (checked) selectedIds.add(cb.dataset.id);
      else selectedIds.delete(cb.dataset.id);
    });
    updateBatchDelete();
  });

  // Row checkbox
  document.getElementById('tableBody').addEventListener('change', function(e) {
    if (e.target.classList.contains('row-checkbox')) {
      var id = e.target.dataset.id;
      if (e.target.checked) selectedIds.add(id);
      else selectedIds.delete(id);
      updateBatchDelete();
    }
  });

  // Pagination
  document.getElementById('pageBtns').addEventListener('click', function(e) {
    if (e.target.tagName === 'BUTTON' && !e.target.disabled) {
      currentPage = parseInt(e.target.dataset.page);
      renderTable();
    }
  });

  // Row actions
  document.getElementById('tableBody').addEventListener('click', function(e) {
    var id = e.target.dataset.id;
    if (!id) {
      // Check for cell-title click
      var cell = e.target.closest('.cell-title');
      if (cell) id = cell.dataset.id;
    }
    if (!id) return;

    if (e.target.classList.contains('view-btn') || e.target.closest('.cell-title')) {
      showDetail(id);
    } else if (e.target.classList.contains('edit-btn')) {
      showEdit(id);
    } else if (e.target.classList.contains('delete-btn')) {
      deleteUnit(id);
    }
  });

  // ===== Upload =====
  var uploadZone = document.getElementById('uploadZone');
  var fileInput = document.getElementById('fileInput');
  var importBar = document.getElementById('importBar');

  // Upload zone click is handled natively by <label for="fileInput">
  // Drag-and-drop handlers
  uploadZone.addEventListener('dragleave', function() { uploadZone.classList.remove('dragover'); });
  uploadZone.addEventListener('drop', function(e) {
    e.preventDefault();
    uploadZone.classList.remove('dragover');
    if (e.dataTransfer.files.length > 0) startImport(e.dataTransfer.files[0]);
  });

  fileInput.addEventListener('change', function() {
    if (this.files.length > 0) startImport(this.files[0]);
  });

  function startImport(file) {
    importBar.classList.add('show');
    document.getElementById('importName').textContent = file.name;
    document.getElementById('importFile').textContent = formatSize(file.size);
    document.getElementById('importStatus').textContent = '解析中';
    document.getElementById('importStatus').className = 'import-bar-status processing';

    var fill = document.getElementById('importFill');
    var pct = document.getElementById('importPct');
    var status = document.getElementById('importStatus');

    var progress = 0;
    var interval = setInterval(function() {
      progress += Math.random() * 15;
      if (progress >= 100) {
        progress = 100;
        clearInterval(interval);
        fill.style.width = '100%';
        pct.textContent = '100%';
        status.textContent = '完成';
        status.className = 'import-bar-status completed';
        // Add to mock data
        var d = new Date();
        mockData.unshift({
          id: 'unit_' + Date.now(),
          unit_code: 'KU-' + String(Math.floor(Math.random() * 999999)).padStart(6, '0'),
          title: file.name.replace(/\.[^.]+$/, ''),
          content: '导入文档内容...',
          summary: '新导入的文档',
          category: '其他',
          source_file_name: file.name,
          file_type: file.name.split('.').pop().toLowerCase(),
          file_size: file.size,
          status: 'published',
          creator_id: 'user_admin',
          created_at: d.toISOString().split('T')[0],
          updated_at: d.toISOString().split('T')[0],
          permissions: [{ id: 'p_auto', target_type: 'global', target_id: '', target_name: '所有人' }]
        });
        renderTable();
        showToast('导入成功', 'success');
        setTimeout(function() { importBar.classList.remove('show'); }, 2000);
      } else {
        fill.style.width = progress + '%';
        pct.textContent = Math.floor(progress) + '%';
      }
    }, 300);
  }

  document.getElementById('importClose').addEventListener('click', function() {
    importBar.classList.remove('show');
  });

  // ===== Detail Modal =====
  function showDetail(id) {
    currentUnitId = id;
    var item = mockData.find(function(u) { return u.id === id; });
    if (!item) return;

    var statusMap = { published: '已发布', draft: '草稿', deleted: '已删除' };
    document.getElementById('detailTitle').textContent = item.title;
    document.getElementById('detailBody').innerHTML =
      '<div class="detail-meta-grid">' +
        '<div class="detail-meta-item"><div class="detail-label">编码</div><div class="detail-value">' + item.unit_code + '</div></div>' +
        '<div class="detail-meta-item"><div class="detail-label">分类</div><div class="detail-value">' + (item.category || '-') + '</div></div>' +
        '<div class="detail-meta-item"><div class="detail-label">状态</div><div class="detail-value"><span class="status-badge ' + item.status + '"><span class="status-dot"></span>' + (statusMap[item.status] || item.status) + '</span></div></div>' +
        '<div class="detail-meta-item"><div class="detail-label">源文件</div><div class="detail-value">' + item.source_file_name + '</div></div>' +
        '<div class="detail-meta-item"><div class="detail-label">文件大小</div><div class="detail-value">' + formatSize(item.file_size) + '</div></div>' +
        '<div class="detail-meta-item"><div class="detail-label">创建时间</div><div class="detail-value">' + item.created_at + '</div></div>' +
      '</div>' +
      (item.summary ? '<div class="detail-section"><div class="detail-label">摘要</div><div class="detail-value">' + escapeHtml(item.summary) + '</div></div>' : '') +
      '<div class="detail-section"><div class="detail-label">内容</div><div class="detail-value">' + escapeHtml(item.content).replace(/\n/g, '<br>') + '</div></div>' +
      '<div class="perm-section"><div class="detail-label">数据权限</div>' +
        '<div class="perm-list" id="permList">' +
          (item.permissions || []).map(function(p) {
            var typeMap = { global: '全局可见', department: '指定部门', role: '指定角色', user: '指定用户' };
            return '<div class="perm-item"><span><span class="perm-type">' + (typeMap[p.target_type] || p.target_type) + '</span><span class="perm-id">' + getPermissionTargetName(p) + '</span></span><span class="perm-remove" data-pid="' + p.id + '">&times;</span></div>';
          }).join('') +
        '</div>' +
        '<div class="perm-add">' +
          '<select id="newPermType"><option value="global">全局可见</option><option value="department">指定部门</option><option value="role">指定角色</option><option value="user">指定用户</option></select>' +
          '<select id="newPermTarget" style="display:none;flex:1;"></select>' +
          '<input type="text" placeholder="输入用户 ID" id="newPermUser" style="display:none;flex:1;">' +
          '<button class="btn btn-primary btn-sm" id="addPermBtn">添加</button>' +
        '</div>' +
      '</div>';

    document.getElementById('detailModal').classList.add('show');

    // Setup perm handlers after dynamic content is created
    setupDetailPermHandlers();
  }

  document.getElementById('detailClose').addEventListener('click', function() {
    document.getElementById('detailModal').classList.remove('show');
  });
  document.getElementById('detailCloseBtn').addEventListener('click', function() {
    document.getElementById('detailModal').classList.remove('show');
  });
  document.getElementById('detailEditBtn').addEventListener('click', function() {
    document.getElementById('detailModal').classList.remove('show');
    showEdit(currentUnitId);
  });

  document.getElementById('detailModal').addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('show');
  });

  // ===== Detail Modal — Permission handlers (delegated) =====
  function setupDetailPermHandlers() {
    var newPermType = document.getElementById('newPermType');
    var newPermTarget = document.getElementById('newPermTarget');
    var newPermUser = document.getElementById('newPermUser');
    if (!newPermType) return;

    newPermType.addEventListener('change', function() {
      newPermTarget.style.display = 'none';
      newPermTarget.innerHTML = '';
      newPermUser.style.display = 'none';

      if (this.value === 'department') {
        newPermTarget.style.display = '';
        newPermTarget.innerHTML = mockDepartments.map(function(d) {
          return '<option value="' + d.id + '">' + d.name + '</option>';
        }).join('');
      } else if (this.value === 'role') {
        newPermTarget.style.display = '';
        newPermTarget.innerHTML = mockRoles.map(function(r) {
          return '<option value="' + r.code + '">' + r.name + '</option>';
        }).join('');
      } else if (this.value === 'user') {
        newPermUser.style.display = '';
      }
    });

    document.getElementById('addPermBtn').addEventListener('click', function() {
      var item = mockData.find(function(u) { return u.id === currentUnitId; });
      if (!item) return;

      var type = newPermType.value;
      var targetId = '';
      var targetName = '';

      if (type === 'global') {
        targetName = '所有人';
      } else if (type === 'department') {
        targetId = newPermTarget.value;
        var dept = mockDepartments.find(function(d) { return d.id === targetId; });
        targetName = dept ? dept.name : targetId;
      } else if (type === 'role') {
        targetId = newPermTarget.value;
        var role = mockRoles.find(function(r) { return r.code === targetId; });
        targetName = role ? role.name : targetId;
      } else if (type === 'user') {
        targetId = newPermUser.value.trim();
        targetName = targetId;
        if (!targetId) { showToast('请输入用户 ID', 'error'); return; }
      }

      var exists = item.permissions.some(function(p) {
        return p.target_type === type && p.target_id === targetId;
      });
      if (exists) { showToast('该权限已存在', 'error'); return; }

      var newPerm = { id: 'p' + Date.now(), target_type: type, target_id: targetId, target_name: targetName };
      item.permissions.push(newPerm);
      refreshPermList(item);
      if (type === 'user') newPermUser.value = '';
    });
  }

  function refreshPermList(item) {
    var permList = document.getElementById('permList');
    if (!permList) return;
    var typeMap = { global: '全局可见', department: '指定部门', role: '指定角色', user: '指定用户' };
    permList.innerHTML = (item.permissions || []).map(function(p) {
      return '<div class="perm-item"><span><span class="perm-type">' + (typeMap[p.target_type] || p.target_type) + '</span><span class="perm-id">' + getPermissionTargetName(p) + '</span></span><span class="perm-remove" data-pid="' + p.id + '">&times;</span></div>';
    }).join('');
  }

  // Delegated handler for perm-remove in detail modal
  document.getElementById('detailBody').addEventListener('click', function(e) {
    if (e.target.classList.contains('perm-remove')) {
      var pid = e.target.getAttribute('data-pid');
      var item = mockData.find(function(u) { return u.id === currentUnitId; });
      if (!item) return;
      item.permissions = item.permissions.filter(function(p) { return p.id !== pid; });
      refreshPermList(item);
    }
  });

  // ===== Edit Modal =====
  function showEdit(id) {
    currentUnitId = id;
    var item = mockData.find(function(u) { return u.id === id; });
    if (!item) return;

    document.getElementById('editTitle').value = item.title;
    document.getElementById('editCategory').value = item.category || '其他';
    document.getElementById('editSummary').value = item.summary || '';
    document.getElementById('editContent').value = item.content;

    // Render permissions
    refreshEditPermList(item);

    document.getElementById('editModal').classList.add('show');
  }

  function refreshEditPermList(item) {
    var permList = document.getElementById('editPermList');
    if (!permList) return;
    var typeMap = { global: '全局可见', department: '指定部门', role: '指定角色', user: '指定用户' };
    permList.innerHTML = (item.permissions || []).map(function(p) {
      return '<div class="perm-item"><span><span class="perm-type">' + (typeMap[p.target_type] || p.target_type) + '</span><span class="perm-id">' + getPermissionTargetName(p) + '</span></span><span class="perm-remove" data-pid="' + p.id + '">&times;</span></div>';
    }).join('');
  }

  // Edit modal perm type switcher
  var editPermType = document.getElementById('editPermType');
  var editPermTarget = document.getElementById('editPermTarget');
  var editPermUser = document.getElementById('editPermUser');

  if (editPermType) {
  editPermType.addEventListener('change', function() {
    editPermTarget.style.display = 'none';
    editPermTarget.innerHTML = '';
    editPermUser.style.display = 'none';

    if (this.value === 'department') {
      editPermTarget.style.display = '';
      editPermTarget.innerHTML = mockDepartments.map(function(d) {
        return '<option value="' + d.id + '">' + d.name + '</option>';
      }).join('');
    } else if (this.value === 'role') {
      editPermTarget.style.display = '';
      editPermTarget.innerHTML = mockRoles.map(function(r) {
        return '<option value="' + r.code + '">' + r.name + '</option>';
      }).join('');
    } else if (this.value === 'user') {
      editPermUser.style.display = '';
    }
  });

  document.getElementById('editAddPermBtn').addEventListener('click', function() {
    var item = mockData.find(function(u) { return u.id === currentUnitId; });
    if (!item) return;

    var type = editPermType.value;
    var targetId = '';
    var targetName = '';

    if (type === 'global') {
      targetName = '所有人';
    } else if (type === 'department') {
      targetId = editPermTarget.value;
      var dept = mockDepartments.find(function(d) { return d.id === targetId; });
      targetName = dept ? dept.name : targetId;
    } else if (type === 'role') {
      targetId = editPermTarget.value;
      var role = mockRoles.find(function(r) { return r.code === targetId; });
      targetName = role ? role.name : targetId;
    } else if (type === 'user') {
      targetId = editPermUser.value.trim();
      targetName = targetId;
      if (!targetId) { showToast('请输入用户 ID', 'error'); return; }
    }

    var exists = item.permissions.some(function(p) {
      return p.target_type === type && p.target_id === targetId;
    });
    if (exists) { showToast('该权限已存在', 'error'); return; }

    item.permissions.push({ id: 'p' + Date.now(), target_type: type, target_id: targetId, target_name: targetName });
    refreshEditPermList(item);
    if (type === 'user') editPermUser.value = '';
  });

  document.getElementById('editPermList').addEventListener('click', function(e) {
    if (e.target.classList.contains('perm-remove')) {
      var pid = e.target.getAttribute('data-pid');
      var item = mockData.find(function(u) { return u.id === currentUnitId; });
      if (!item) return;
      item.permissions = item.permissions.filter(function(p) { return p.id !== pid; });
      refreshEditPermList(item);
    }
  });

  } // end if (editPermType)

  document.getElementById('editClose').addEventListener('click', function() {
    document.getElementById('editModal').classList.remove('show');
  });
  document.getElementById('editCancelBtn').addEventListener('click', function() {
    document.getElementById('editModal').classList.remove('show');
  });
  document.getElementById('editModal').addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('show');
  });

  document.getElementById('editSaveBtn').addEventListener('click', function() {
    var item = mockData.find(function(u) { return u.id === currentUnitId; });
    if (!item) return;
    item.title = document.getElementById('editTitle').value;
    item.category = document.getElementById('editCategory').value;
    item.summary = document.getElementById('editSummary').value;
    item.content = document.getElementById('editContent').value;
    item.updated_at = new Date().toISOString().split('T')[0];
    document.getElementById('editModal').classList.remove('show');
    renderTable();
    showToast('保存成功', 'success');
  });

  // ===== Delete =====
  function deleteUnit(id) {
    if (!confirm('确定要删除该知识单元吗？')) return;
    var item = mockData.find(function(u) { return u.id === id; });
    if (item) item.status = 'deleted';
    selectedIds.delete(id);
    renderTable();
    showToast('已删除', 'success');
  }

  document.getElementById('batchDeleteBtn').addEventListener('click', function() {
    if (selectedIds.size === 0) return;
    if (!confirm('确定要批量删除 ' + selectedIds.size + ' 个知识单元吗？')) return;
    selectedIds.forEach(function(id) {
      var item = mockData.find(function(u) { return u.id === id; });
      if (item) item.status = 'deleted';
    });
    selectedIds.clear();
    renderTable();
    showToast('已批量删除', 'success');
  });

  // ===== Toast =====
  function showToast(msg, type) {
    var toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = 'toast ' + type + ' show';
    clearTimeout(toast._timer);
    toast._timer = setTimeout(function() { toast.classList.remove('show'); }, 2500);
  }

  // ===== Helpers =====
  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1048576).toFixed(1) + ' MB';
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ===== Init =====
  try {
    renderTable();
  } catch(e) {
    document.getElementById('tableBody').innerHTML = '<tr><td colspan="7"><div class="empty-state"><p>页面加载失败，请刷新重试</p></div></td></tr>';
  }
})();
</script>
</body>
</html>
