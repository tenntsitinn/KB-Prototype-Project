<script>
(function() {
  var tokenData = sessionStorage.getItem('kb_token') || localStorage.getItem('kb_token');
  if (!tokenData) { window.location.replace('login.html'); return; }

  // Role-based sidebar visibility
  var userData = getUserData(tokenData);
  if (userData) {
    var roles = userData.roles || [];
    if (roles.indexOf('super_admin') === -1) {
      var navSettlement = document.getElementById('navSettlement');
      var navAdmin = document.getElementById('navAdmin');
      var navDivider1 = document.getElementById('navDivider1');
      var navDivider2 = document.getElementById('navDivider2');
      if (roles.indexOf('knowledge_admin') !== -1) {
        if (navAdmin) navAdmin.style.display = 'none';
      } else {
        if (navDivider1) navDivider1.style.display = 'none';
        if (navSettlement) navSettlement.style.display = 'none';
        if (navDivider2) navDivider2.style.display = 'none';
        if (navAdmin) navAdmin.style.display = 'none';
      }
    }
    var avatar = document.querySelector('.user-avatar');
    var nameEl = document.querySelector('.user-name');
    var roleEl = document.querySelector('.user-role');
    if (nameEl) nameEl.textContent = userData.display_name || userData.username || '';
    if (avatar && nameEl) avatar.textContent = (nameEl.textContent || 'U').charAt(0);
    if (roleEl) {
      if (roles.indexOf('super_admin') !== -1) roleEl.textContent = '系统管理员';
      else if (roles.indexOf('knowledge_admin') !== -1) roleEl.textContent = '知识管理员';
      else roleEl.textContent = '普通用户';
    }
    document.getElementById('popupAvatar').textContent = (userData.display_name || userData.username || 'U').charAt(0);
    document.getElementById('popupName').textContent = userData.display_name || userData.username || '';
    document.getElementById('popupRole').textContent = roleEl ? roleEl.textContent : '';
    document.getElementById('popupUsername').textContent = userData.username || '';
    document.getElementById('popupEmail').textContent = userData.email || '未设置';
    document.getElementById('popupDept').textContent = userData.department_name || '未设置';
  }

  // User popup
  var userCard = document.querySelector('.user-card');
  var userPopup = document.getElementById('userPopup');
  var userPopupOverlay = document.getElementById('userPopupOverlay');

  function showPopup() {
    var rect = userCard.getBoundingClientRect();
    userPopup.style.left = Math.min(rect.left, window.innerWidth - 296) + 'px';
    userPopup.style.bottom = (window.innerHeight - rect.top + 8) + 'px';
    userPopup.classList.add('show');
    userPopupOverlay.classList.add('show');
  }

  function hidePopup() {
    userPopup.classList.remove('show');
    userPopupOverlay.classList.remove('show');
  }

  userCard.addEventListener('click', function(e) {
    e.stopPropagation();
    if (userPopup.classList.contains('show')) { hidePopup(); } else { showPopup(); }
  });

  userPopupOverlay.addEventListener('click', hidePopup);

  document.getElementById('popupSettings').addEventListener('click', function() {
    hidePopup();
    window.location.href = 'settings.html';
  });

  function getUserData(raw) {
    try { var d = JSON.parse(raw); return d.user || d; } catch(e) { return null; }
  }

  document.getElementById('popupLogout').addEventListener('click', function() {
    hidePopup();
    sessionStorage.removeItem('kb_token'); localStorage.removeItem('kb_token');
    window.location.replace('login.html');
  });

  var allData = [
    { id:'g1', question_pattern:'OCR 解析 PDF 时出现乱码', sample_questions:['OCR 解析出来的文字乱码怎么办','PDF 扫描件识别不准确','PaddleOCR 识别率低'], ask_count:67, last_asked_at:'2026-08-17 14:30', status:'unresolved' },
    { id:'g2', question_pattern:'多轮对话上下文丢失', sample_questions:['为什么第二轮对话记不住之前的问题','上下文关联失败','对话历史丢失'], ask_count:52, last_asked_at:'2026-08-17 11:15', status:'unresolved' },
    { id:'g3', question_pattern:'权限配置后不生效', sample_questions:['设置了部门权限但还是看不到','权限改了没反应','权限缓存多久刷新'], ask_count:45, last_asked_at:'2026-08-16 16:20', status:'unresolved' },
    { id:'g4', question_pattern:'Docker 部署网络问题', sample_questions:['Docker 容器无法访问外部网络','容器间通信失败','Docker 网络配置'], ask_count:38, last_asked_at:'2026-08-16 09:00', status:'unresolved' },
    { id:'g5', question_pattern:'PDF 拆分后合并问题', sample_questions:['大 PDF 拆分后怎么合并','拆分后的子文档关联','PDF 拆分逻辑'], ask_count:23, last_asked_at:'2026-08-15 18:45', status:'unresolved' },
    { id:'g6', question_pattern:'API 接口响应超时', sample_questions:['RAG 接口偶尔超时','大文件上传超时','Token 限制导致响应慢'], ask_count:31, last_asked_at:'2026-08-16 10:00', status:'unresolved' },
    { id:'g7', question_pattern:'CES 部署到生产环境', sample_questions:['生产环境部署步骤','Docker Compose 配置','环境变量模板'], ask_count:28, last_asked_at:'2026-08-15 20:00', status:'unresolved' },
    { id:'g8', question_pattern:'向量检索速度慢', sample_questions:['Milvus 查询很慢怎么办','向量检索性能优化','检索延迟高'], ask_count:19, last_asked_at:'2026-08-14 10:30', status:'resolved', resolved_unit_id:'unit_0014' },
    { id:'g9', question_pattern:'知识单元去重逻辑', sample_questions:['相同文件重复上传会怎样','MD5 去重机制','重复内容如何处理'], ask_count:15, last_asked_at:'2026-08-13 15:00', status:'ignored' },
  ];

  var currentPage = 1;
  var pageSize = 10;

  document.getElementById('statusFilter').addEventListener('change', function() {
    currentPage = 1;
    render();
  });

  function render() {
    var status = document.getElementById('statusFilter').value;
    var filtered = status ? allData.filter(function(d) { return d.status === status; }) : allData;
    var total = filtered.length;
    var totalPages = Math.ceil(total / pageSize);
    if (currentPage > totalPages) currentPage = Math.max(1, totalPages);
    var start = (currentPage - 1) * pageSize;
    var items = filtered.slice(start, start + pageSize);

    var statusMap = { unresolved: '未解决', resolved: '已解决', ignored: '已忽略' };
    var tbody = document.getElementById('gapBody');
    if (items.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-5"/></svg><p>没有匹配的缺口记录</p></div></td></tr>';
    } else {
      tbody.innerHTML = items.map(function(item) {
        var isUnresolved = item.status === 'unresolved';
        var freqClass = item.ask_count >= 50 ? 'freq-high' : (item.ask_count >= 30 ? 'freq-mid' : 'freq-low');
        return '<tr>' +
          '<td><span class="cell-text" style="font-weight:500">' + esc(item.question_pattern) + '</span></td>' +
          '<td><span class="cell-text" title="' + esc(item.sample_questions.join(', ')) + '">' + esc(item.sample_questions.slice(0, 2).join('、')) + '</span></td>' +
          '<td><span class="cell-meta ' + freqClass + '">' + item.ask_count + ' 次</span></td>' +
          '<td><span class="cell-meta">' + (item.last_asked_at || '-') + '</span></td>' +
          '<td><span class="status-badge ' + item.status + '"><span class="status-dot"></span>' + (statusMap[item.status] || item.status) + '</span></td>' +
          '<td><div class="actions-cell">' +
            (isUnresolved ? '<button class="btn btn-primary btn-xs resolve-btn" data-id="' + item.id + '">创建知识单元</button><button class="btn btn-outline btn-xs ignore-btn" data-id="' + item.id + '">忽略</button>' : '') +
            (item.status === 'resolved' ? '<span class="cell-meta">关联: ' + item.resolved_unit_id + '</span>' : '') +
            (item.status === 'ignored' ? '<span class="cell-meta">—</span>' : '') +
          '</div></td>' +
        '</tr>';
      }).join('');
    }

    document.getElementById('gapTotal').textContent = '共 ' + total + ' 条';
    document.getElementById('statUnresolved').textContent = allData.filter(function(d) { return d.status === 'unresolved'; }).length;
    document.getElementById('statResolved').textContent = allData.filter(function(d) { return d.status === 'resolved'; }).length;
    document.getElementById('statIgnored').textContent = allData.filter(function(d) { return d.status === 'ignored'; }).length;
    renderPagination(totalPages);
  }

  document.getElementById('gapBody').addEventListener('click', function(e) {
    var id = e.target.dataset.id;
    if (!id) return;
    var item = allData.find(function(g) { return g.id === id; });
    if (!item) return;
    if (e.target.classList.contains('resolve-btn')) {
      var unitId = 'unit_gap_' + Date.now();
      item.status = 'resolved';
      item.resolved_unit_id = unitId;
      render();
      showToast('已创建知识单元 ' + unitId + ' 并关联', 'success');
    } else if (e.target.classList.contains('ignore-btn')) {
      item.status = 'ignored';
      render();
      showToast('已忽略该缺口', 'success');
    }
  });

  function renderPagination(totalPages) {
    var btn = document.getElementById('gapPagination');
    if (totalPages <= 1) { btn.innerHTML = ''; return; }
    btn.innerHTML = '<div class="pagination-info">第 ' + currentPage + '/' + totalPages + ' 页</div><div class="pagination-btns"><button ' + (currentPage === 1 ? 'disabled' : '') + ' data-page="' + (currentPage - 1) + '">&laquo;</button>';
    var sp = Math.max(1, Math.min(currentPage - 2, totalPages - 4));
    var ep = Math.min(totalPages, Math.max(currentPage + 2, 5));
    if (sp > 1) btn.innerHTML += '<button data-page="1">1</button><span style="color:var(--text-muted);padding:0 4px">…</span>';
    for (var p = sp; p <= ep; p++) btn.innerHTML += '<button class="' + (p === currentPage ? 'active' : '') + '" data-page="' + p + '">' + p + '</button>';
    if (ep < totalPages) btn.innerHTML += '<span style="color:var(--text-muted);padding:0 4px">…</span><button data-page="' + totalPages + '">' + totalPages + '</button>';
    btn.innerHTML += '<button ' + (currentPage === totalPages ? 'disabled' : '') + ' data-page="' + (currentPage + 1) + '">&raquo;</button></div>';
    btn.addEventListener('click', function(e) { if (e.target.tagName === 'BUTTON' && !e.target.disabled) { currentPage = parseInt(e.target.dataset.page); render(); } }, { once: true });
  }

  function showToast(msg, type) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast ' + type + ' show';
    clearTimeout(t._timer); t._timer = setTimeout(function() { t.classList.remove('show'); }, 2500);
  }

  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  render();
})();
</script>
</body>
</html>
