[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
markers =
    integration: requires one or more local infrastructure services
    e2e: exercises a complete application workflow
    ocr: requires OCR models or OCR-specific runtime dependencies
    gpu: requires a supported GPU runtime
    external_api: may call a real third-party API and can incur cost

